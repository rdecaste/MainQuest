  <meta charset="utf-8" />

  <title>Main Quest</title>
  <style>
    :root {
      --bg:#05070b;
      --text:#fff;
      --muted:rgba(255,255,255,.72);
      --accent-a:#ff9f1c;
      --accent-b:#ffd54a;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body{width:100vw;height:100vh;height:100dvh}
    .app{position:absolute;inset:0;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;background:var(--bg);--rate-color:#b7773d;--rate-a:#8d5524;--rate-b:#d59656;--rate-glow:rgba(191,119,57,.28);--flow-duration:9s;--flow-opacity:.08;--bar-glow:0 0 4px rgba(183,119,61,.22);--pulse-duration:9s;--label-glow-radius:3px;--label-pulse-duration:9s;--label-shimmer-duration:12s;--label-shimmer-opacity:.06;--word-a:#74421f;--word-b:#b7773d;--word-c:#e0a56b;--word-glow:rgba(183,119,61,.28)}
    .hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:var(--bg);display:block;transform:scale(var(--video-scale,1));transform-origin:center;opacity:0;transition:opacity 1200ms linear;will-change:opacity;pointer-events:none;z-index:0}
    .hero-video.is-active{opacity:1}
    /* Hero mood mirrors the quest: same video, lit up on strong days, dimmed when slipping.
       Plain overlays only, so the video element itself is never restyled. Playback speed is
       never changed, so his breathing stays a steady pace to follow. Preview with ?mood=. */
    .hero-glow,.hero-shade{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 2s ease}
    .hero-glow{background:radial-gradient(ellipse 60% 45% at 50% 42%,rgba(255,210,120,.22),transparent 70%)}
    .hero-shade{background:radial-gradient(ellipse 75% 60% at 50% 45%,rgba(40,42,50,.38) 0%,rgba(20,22,28,.5) 55%,rgba(0,0,0,.72) 100%)}
    .app[data-mood="strong"] .hero-glow{opacity:1;animation:hero-glow 4s ease-in-out infinite}
    .app[data-mood="slipping"] .hero-shade{opacity:1}
    @keyframes hero-glow{0%,100%{opacity:.55}50%{opacity:1}}
    .hud-top{position:absolute;top:calc(12px + var(--safe-top));left:calc(12px + var(--safe-left));right:calc(12px + var(--safe-right));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:2;pointer-events:none}
    .metric.right{flex:0 0 auto;text-align:right}
    .label{font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 4px rgba(0,0,0,.85)}
    .value{margin-top:3px;font-size:clamp(23px,6.5vw,31px);line-height:1;font-weight:850;letter-spacing:-.04em;text-shadow:0 1px 6px rgba(0,0,0,.9)}
    .hud-bottom{position:absolute;left:calc(12px + var(--safe-left));right:calc(12px + var(--safe-right));bottom:calc(14px + var(--safe-bottom));z-index:2;pointer-events:none}
    .app[data-tier="2"]{--rate-color:#d6d9df;--rate-a:#9fa7b2;--rate-b:#eef2f7;--rate-glow:rgba(220,226,236,.38);--flow-duration:6.5s;--flow-opacity:.20;--bar-glow:0 0 7px rgba(214,219,228,.34);--pulse-duration:6.5s;--label-glow-radius:5px;--label-pulse-duration:6.5s;--label-shimmer-duration:8.5s;--label-shimmer-opacity:.18;--word-a:#8d95a0;--word-b:#d6d9df;--word-c:#ffffff;--word-glow:rgba(220,226,236,.45)}
    .app[data-tier="3"]{--rate-color:#ffd65c;--rate-a:#c99318;--rate-b:#ffe985;--rate-glow:rgba(255,211,72,.54);--flow-duration:3.8s;--flow-opacity:.34;--bar-glow:0 0 11px rgba(255,211,72,.48);--pulse-duration:4.4s;--label-glow-radius:8px;--label-pulse-duration:4.4s;--label-shimmer-duration:5.5s;--label-shimmer-opacity:.32;--word-a:#a26c0d;--word-b:#ffd65c;--word-c:#fff3a1;--word-glow:rgba(255,211,72,.60)}
    .app[data-tier="4"]{--rate-color:#6fd5ff;--rate-a:#1597e5;--rate-b:#a8ecff;--rate-glow:rgba(61,190,255,.74);--flow-duration:1.9s;--flow-opacity:.56;--bar-glow:0 0 16px rgba(42,184,255,.68),0 0 28px rgba(42,184,255,.24);--pulse-duration:2.6s;--label-glow-radius:12px;--label-pulse-duration:2.6s;--label-shimmer-duration:3.2s;--label-shimmer-opacity:.56;--word-a:#0b7dcb;--word-b:#6fd5ff;--word-c:#d5f6ff;--word-glow:rgba(61,190,255,.78)}
    .app[data-rarity="rare"] .progress-wordmark{filter:drop-shadow(0 1px 2px rgba(0,0,0,.9)) drop-shadow(0 0 calc(var(--label-glow-radius) + 4px) var(--word-glow)) drop-shadow(0 0 12px var(--word-glow))}
    .app[data-rarity="epic"] .progress-wordmark{filter:drop-shadow(0 1px 2px rgba(0,0,0,.95)) drop-shadow(0 0 calc(var(--label-glow-radius) + 6px) var(--word-glow)) drop-shadow(0 0 18px var(--word-glow)) drop-shadow(0 0 28px var(--word-glow))}
    .bar-row + .bar-row{margin-top:11px}
    .bar-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
    .bar-num{font-size:12px;font-weight:850;letter-spacing:-.01em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.9);font-variant-numeric:tabular-nums}
    .hp-track{width:100%;height:6px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.18)}
    .hp-fill{width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#3ddc84,#8ef0b4);transition:width 300ms ease}
    .hp-row[data-low="1"] .hp-fill{background:linear-gradient(90deg,#ff5f5f,#ff9f1c)}
    .motivation-line{display:flex;align-items:center;gap:7px;min-width:0;padding-top:4px}
    .motivation-emoji{flex:0 0 auto;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:20px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9));transform:translateY(-1px)}
    .progress-wordmark{width:min(calc(100vw - 130px),252px);height:28px;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9)) drop-shadow(0 0 calc(var(--label-glow-radius) + 3px) var(--word-glow)) drop-shadow(0 0 10px var(--word-glow));animation:label-pulse var(--label-pulse-duration) ease-in-out infinite}
    .progress-wordmark text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;font-weight:760;letter-spacing:.25px;fill:url(#wordGradient);paint-order:stroke fill;stroke:rgba(0,0,0,.22);stroke-width:.35px}
    .progress-wordmark .word-stop-a{stop-color:var(--word-a)}
    .progress-wordmark .word-stop-b{stop-color:var(--word-b)}
    .progress-wordmark .word-stop-c{stop-color:var(--word-c)}
    .progress-wordmark .word-shimmer{fill:url(#shimmerGradient);opacity:var(--label-shimmer-opacity);mix-blend-mode:screen;animation:svg-shimmer var(--label-shimmer-duration) linear infinite}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .progress-track{position:relative;width:100%;height:6px;overflow:visible;border-radius:999px;background:rgba(255,255,255,.18)}
    /* One notch where each stage of the level starts; passed notches glow. */
    .stage-notch{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:rgba(255,255,255,.35);pointer-events:none}
    .stage-notch.is-passed{background:var(--rate-b);box-shadow:0 0 5px var(--rate-glow)}
    .stage-tag{font-size:11px;font-weight:760;letter-spacing:.3px;color:rgba(255,255,255,.72)}
    .progress-track.stage-up{animation:stage-up 1.2s ease-out 2}
    @keyframes stage-up{0%{box-shadow:0 0 0 0 var(--rate-glow)}40%{box-shadow:0 0 14px 4px var(--rate-glow)}100%{box-shadow:0 0 0 0 transparent}}
    .progress-fill{position:relative;width:0%;height:100%;overflow:hidden;border-radius:inherit;background:linear-gradient(90deg,var(--rate-a),var(--rate-b));box-shadow:var(--bar-glow);transition:width 300ms ease;animation:bar-pulse var(--pulse-duration) ease-in-out infinite}
    .progress-fill::after{content:"";position:absolute;top:0;bottom:0;left:-45%;width:42%;background:linear-gradient(90deg,transparent,rgba(255,255,255,var(--flow-opacity)),transparent);transform:skewX(-18deg);animation:bar-flow var(--flow-duration) linear infinite}
    @keyframes bar-flow{from{left:-45%}to{left:110%}}
    @keyframes bar-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.10)}}
    @keyframes label-pulse{0%,100%{opacity:.94;filter:brightness(.98)}50%{opacity:1;filter:brightness(1.09)}}
    @keyframes svg-shimmer{from{transform:translateX(-260px)}to{transform:translateX(280px)}}
    .xp-num-wrap{position:relative}
    .bar-title{display:flex;align-items:center;gap:8px}
    .rate-dots{display:flex;gap:4px}
    .rate-dot{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);background:rgba(0,0,0,.25)}
    .rate-dot.is-on{background:var(--rate-b);box-shadow:0 0 5px var(--rate-glow)}
    .xp-gain{position:absolute;right:100%;top:50%;margin:-13px 8px 0 0;white-space:nowrap;padding:5px 8px;border-radius:8px;background:rgba(5,7,11,.7);color:var(--accent-b);font-size:13px;font-weight:800}
    .xp-gain:not([hidden]){animation:xp-arrive 450ms ease-out}
    @keyframes xp-arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.hero-video{transition:none}.app[data-mood="strong"] .hero-glow{animation:none}.hp-fill{transition:none}.xp-gain:not([hidden]){animation:none}.progress-track.stage-up{animation:none}.progress-fill{transition:none;animation:none}.progress-fill::after{animation:none;display:none}.progress-wordmark,.progress-wordmark .word-shimmer{animation:none}.progress-wordmark .word-shimmer{display:none}}

    /* The card flips on a tap, like the boss card. The back is Goku's side of the
       game: only what's already happened (forms reached, days logged, records).
       Nothing on it previews a form, level or stage still to come. */
    :root{--flip-ms:1100ms;--scouter:#7dffb0;--scouter-dim:rgba(125,255,176,.55);--gold:#ffd65c}
    .stage{position:fixed;inset:0;perspective:1800px;background:var(--bg)}
    /* Symmetric easing keeps the edge-on moment at exactly half the duration,
       which is when the faces swap visibility (Safari can ignore
       backface-visibility on <video>). */
    .flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--flip-ms) cubic-bezier(.45,0,.55,1)}
    .flipper.is-flipped{transform:rotateY(180deg)}
    .app,.hero-back{-webkit-backface-visibility:hidden;backface-visibility:hidden}
    .flipper.show-back .app,.flipper:not(.show-back) .hero-back{visibility:hidden}
    .hero-back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;padding:calc(14px + var(--safe-top)) calc(14px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(14px + var(--safe-left));background:radial-gradient(120% 70% at 50% 0%,rgba(255,159,28,.16),transparent 60%),linear-gradient(180deg,#111624,#080b12);overflow:hidden}
    .hb-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;cursor:pointer}
    .hb-title{font-size:clamp(18px,5.6vw,24px);font-weight:850;letter-spacing:-.02em;line-height:1.1}
    .hb-sub{margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)}
    .hb-level{text-align:right}
    .hb-level .value{font-size:clamp(20px,6vw,26px)}
    .hero-back .label{text-shadow:none}
    .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px;padding:3px;border-radius:11px;background:rgba(255,255,255,.06)}
    .tab{border:0;margin:0;padding:7px 0;border-radius:8px;background:transparent;color:rgba(255,255,255,.5);font:inherit;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    .tab[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
    .panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 0}
    .panel[hidden]{display:none}
    .hint{flex:0 0 auto;padding-top:6px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.4);cursor:pointer}
    .empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
    /* Scouter: one reading per flip, drawn at random from what you've done. */
    .scouter{position:relative;overflow:hidden;padding:18px 16px 16px;border-radius:16px;border:1px solid rgba(125,255,176,.28);background:radial-gradient(120% 90% at 85% 10%,rgba(125,255,176,.18),transparent 55%),rgba(10,30,20,.55);box-shadow:inset 0 0 24px rgba(125,255,176,.08)}
    .scouter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(125,255,176,.05) 0 1px,transparent 1px 4px);pointer-events:none}
    .scouter .label{color:var(--scouter-dim)}
    .reading{position:relative;margin-top:8px;min-height:2.6em;font-size:clamp(17px,5vw,21px);font-weight:800;line-height:1.3;color:var(--scouter);text-shadow:0 0 10px rgba(125,255,176,.35)}
    .reading.typing::after{content:"▌";margin-left:2px;animation:blink .8s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .scouter.rare{border-color:rgba(255,214,92,.55);background:radial-gradient(120% 90% at 85% 10%,rgba(255,214,92,.25),transparent 55%),rgba(40,28,6,.6);box-shadow:inset 0 0 28px rgba(255,214,92,.15),0 0 22px rgba(255,214,92,.18)}
    .scouter.rare .label{color:rgba(255,214,92,.8)}
    .scouter.rare .reading{color:var(--gold);text-shadow:0 0 12px rgba(255,214,92,.45)}
    .records{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
    .record{padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
    .record-num{font-size:20px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
    .record .label{margin-top:3px;display:block}
    /* Forms: only the ones already reached, newest first. Tap one to replay it. */
    .forms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .form{position:relative;overflow:hidden;aspect-ratio:3/4;border-radius:14px;background:#0b0f17 center/cover no-repeat;border:1px solid rgba(255,255,255,.09);cursor:pointer}
    .form video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s linear}
    .form video.ready{opacity:1}
    .form-cap{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85))}
    .form-name{font-size:13px;font-weight:850;line-height:1.15}
    .form-meta{margin-top:2px;font-size:10px;font-weight:700;color:var(--muted)}
    .form-now{position:absolute;top:8px;left:8px;padding:3px 7px;border-radius:999px;background:rgba(255,159,28,.9);color:#111;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    /* Lore: the current form's story on the Lore tab (like the boss card); an earlier form's from its tile on Forms. */
    .forms[hidden],.form-detail[hidden]{display:none}
    .form-back{border:1px solid rgba(255,255,255,.12);margin:0;padding:5px 10px;border-radius:999px;background:transparent;color:rgba(255,255,255,.7);font:inherit;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
    .form-big{width:62%;margin:12px auto 0}
    .lore{padding:14px 4px 12px}
    .lore-epithet{font-size:10px;font-weight:850;letter-spacing:.24em;text-transform:uppercase;color:#ffb547}
    .lore-name{margin-top:6px;font-size:clamp(22px,7vw,28px);font-weight:900;letter-spacing:-.02em;line-height:1.1}
    .lore-text{margin:14px 0 0;font-size:15px;font-weight:500;line-height:1.6;color:var(--muted);white-space:pre-line}
    .lore-facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
    .lore-facts span{padding:5px 9px;border:1px solid rgba(255,255,255,.12);border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
    /* Log: the last 14 journal days. */
    .days{list-style:none;margin:0;padding:0}
    .day{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
    .day-date{font-size:12px;font-weight:800;color:var(--muted)}
    .day-what{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;font-weight:700}
    .pill{padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:800;white-space:nowrap}
    .pill.moved{background:rgba(125,255,176,.14);color:var(--scouter)}
    .pill.rest{color:rgba(255,255,255,.45)}
    .pill.up{background:rgba(255,214,92,.16);color:var(--gold)}
    .pill.hp{background:rgba(125,255,176,.1);color:var(--scouter)}
    .pill.dmg{background:rgba(255,92,92,.12);color:#ff8a8a}
    .day-xp{font-size:13px;font-weight:850;color:var(--accent-b);font-variant-numeric:tabular-nums;white-space:nowrap}
    .day-xp.pending{color:rgba(255,255,255,.35);font-weight:700;font-size:11px}
    /* Goku's power (quest-engine src/power.js, 2 Oct 2026). Each drives one thing:
       gravity -> XP, moves -> attack, ki shield -> shield, the 6-hour week -> HP. */
    :root{--ki:#5ab8ff;--silver:#dfe8ff;--gravity:#ffcf8a}
    .hp-track{position:relative}
    .hp-shield{position:absolute;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,rgba(90,184,255,.6),rgba(170,225,255,.95));box-shadow:0 0 10px rgba(90,184,255,.85);animation:ki-pulse 2.4s ease-in-out infinite}
    .hp-row[data-shield="1"] .hp-track{box-shadow:0 0 0 1px rgba(90,184,255,.55),0 0 10px rgba(90,184,255,.45)}
    .hp-shield-num{color:var(--ki)}
    @keyframes ki-pulse{50%{box-shadow:0 0 16px rgba(90,184,255,1)}}
    /* The 6-hour week: a silver Ultra Instinct glow until Sunday night, and a Senzu banner once. */
    .ultra-glow{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 2s ease;background:radial-gradient(ellipse 70% 50% at 50% 45%,rgba(223,232,255,.26),transparent 70%),linear-gradient(180deg,rgba(200,215,255,.12),transparent 40%);mix-blend-mode:screen}
    .app[data-ultra="1"] .ultra-glow{opacity:1;animation:ultra 3.2s ease-in-out infinite}
    @keyframes ultra{50%{opacity:.55}}
    .senzu{position:absolute;left:calc(16px + var(--safe-left));right:calc(16px + var(--safe-right));top:40%;z-index:3;padding:13px 14px;border-radius:16px;background:rgba(10,14,24,.8);border:1px solid rgba(223,232,255,.45);box-shadow:0 0 30px rgba(200,215,255,.35);text-align:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
    .senzu[hidden]{display:none}
    .senzu-big{font-size:19px;font-weight:900;color:var(--silver)}
    .senzu-sm{margin-top:4px;font-size:12px;font-weight:700;color:rgba(255,255,255,.75)}
    .senzu-heal{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:999px;background:rgba(125,255,176,.15);color:var(--scouter);font-size:12px;font-weight:900}
    /* Back: power on the Scouter tab, moves on their own tab. */
    .sc-power{position:relative;margin-top:12px;padding-top:11px;border-top:1px solid rgba(125,255,176,.18)}
    .sc-power[hidden],.power-cells[hidden]{display:none}
    .sc-power .label{color:var(--scouter-dim)}
    .scouter.rare .sc-power{border-top-color:rgba(255,214,92,.25)}
    .power-cells{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
    .pcell{padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
    .pcell .label{display:block;margin-top:3px;text-shadow:none}
    .pcell-num{font-size:20px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
    .pcell.gv{background:rgba(255,180,90,.07);border-color:rgba(255,180,90,.22)}
    .pcell.gv .pcell-num,.pcell.gv .label{color:var(--gravity)}
    .pcell.wk .pcell-num,.pcell.wk .label{color:var(--silver)}

    .pl-trend{margin-left:6px;font-size:12px;font-weight:800;color:var(--scouter);opacity:.8}

    .gauge{position:relative;height:6px;border-radius:999px;background:rgba(255,255,255,.12);margin:16px 4px 26px}
    .gauge-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#2fbf71,#7dffb0);box-shadow:0 0 8px rgba(125,255,176,.6)}
    .g-mark{position:absolute;top:-5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#0b0f17;border:2px solid rgba(255,255,255,.3)}

    .g-mark.next{border-color:var(--gold)}

    .cal{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;margin-top:7px}

    .moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

      ],
      2: [
        {text:'💪 NICE. KEEP GOING.',rarity:'common',weight:8},{text:'✨ YOU\'RE DOING GREAT',rarity:'common',weight:8},{text:'🏆 KEEP STACKING WINS',rarity:'common',weight:8},{text:'🔥 MOMENTUM IS BUILDING',rarity:'common',weight:8},{text:'🚀 THAT\'S THE DIRECTION',rarity:'common',weight:8},{text:'👊 KEEP THIS MOVING',rarity:'common',weight:8},{text:'💪 GOOD WORK. STAY ON IT.',rarity:'common',weight:8},{text:'😎 YOU\'RE FINDING YOUR RHYTHM',rarity:'common',weight:8},{text:'✨ OKAY, THIS IS CLICKING',rarity:'rare',weight:3},{text:'🚀 LOOK AT YOU GO',rarity:'rare',weight:3},{text:'🔥 THE MOMENTUM IS REAL',rarity:'rare',weight:3},{text:'⚡ THIS IS STARTING TO MOVE',rarity:'rare',weight:3},{text:'🔥 KEEP FEEDING THE FIRE',rarity:'rare',weight:3},{text:'🦾 YOU\'RE BUILDING SOMETHING HERE',rarity:'epic',weight:1},{text:'⚡ THE ENGINE IS WAKING UP',rarity:'epic',weight:1},{text:'🏆 YOUR FUTURE SELF NOTICED THAT',rarity:'epic',weight:1},{text:'🔥 THIS IS HOW MOMENTUM IS MADE',rarity:'epic',weight:1},{text:'✨ KEEP GOING. THIS IS WORKING.',rarity:'epic',weight:1}
      ],
      3: [
        {text:'🔥 YOU\'RE ON FIRE',rarity:'common',weight:8},{text:'💪 THIS IS STRONG',rarity:'common',weight:8},{text:'👊 KEEP PRESSING',rarity:'common',weight:8},{text:'🚀 YOU\'RE CRUSHING TODAY',rarity:'common',weight:8},{text:'🏆 THAT\'S HOW YOU SHOW UP',rarity:'common',weight:8},{text:'⚡ SERIOUS MOMENTUM',rarity:'common',weight:8},{text:'😎 YOU\'RE LOCKED IN',rarity:'common',weight:8},{text:'🔥 KEEP THE PRESSURE ON',rarity:'common',weight:8},{text:'💥 OKAY, THIS IS GETTING SERIOUS',rarity:'rare',weight:3},{text:'🦾 THE STREAK HAS TEETH NOW',rarity:'rare',weight:3},{text:'🔥 YOU\'RE COOKING',rarity:'rare',weight:3},{text:'⚡ THIS VERSION IS DIFFERENT',rarity:'rare',weight:3},{text:'👊 DON\'T TAKE YOUR FOOT OFF IT',rarity:'rare',weight:3},{text:'🦾 THE MACHINE IS ONLINE',rarity:'epic',weight:1},{text:'💥 YOU\'RE BECOMING DANGEROUS',rarity:'epic',weight:1},{text:'🏆 THIS IS WHAT BUILDING LOOKS LIKE',rarity:'epic',weight:1},{text:'⚡ YOU\'RE TURNING EFFORT INTO POWER',rarity:'epic',weight:1},{text:'😎 MOMENTUM HAS ENTERED THE CHAT',rarity:'epic',weight:1}
      ],
      4: [
        {text:'⚡ ABSOLUTELY CRUSHING IT',rarity:'common',weight:8},{text:'🔥 YOU\'RE UNSTOPPABLE',rarity:'common',weight:8},{text:'🦾 BEAST MODE',rarity:'common',weight:8},{text:'💥 HELL YES',rarity:'common',weight:8},{text:'😎 THIS IS YOUR ZONE',rarity:'common',weight:8},{text:'🚀 YOU\'RE FLYING',rarity:'common',weight:8},{text:'🏆 KEEP DOMINATING',rarity:'common',weight:8},{text:'⚡ FULL POWER',rarity:'common',weight:8},{text:'🦾 ABSOLUTE MACHINE',rarity:'rare',weight:3},{text:'💪 YOU\'RE BUILT FOR THIS',rarity:'rare',weight:3},{text:'🔥 THIS IS PEAK YOU',rarity:'rare',weight:3},{text:'🏆 THE STANDARD JUST MOVED',rarity:'rare',weight:3},{text:'😎 YOU\'RE MAKING THIS LOOK EASY',rarity:'rare',weight:3},{text:'⚡ THIS VERSION OF YOU DOESN\'T QUIT',rarity:'epic',weight:1},{text:'🚀 THE LIMIT JUST MOVED AGAIN',rarity:'epic',weight:1},{text:'💥 YOU CAME TO PLAY TODAY',rarity:'epic',weight:1},{text:'🔥 THIS IS WHAT UNSTOPPABLE LOOKS LIKE',rarity:'epic',weight:1},{text:'🏆 KEEP GOING. YOU\'RE WRITING THE STORY.',rarity:'epic',weight:1}
      ]
    };

    const videos = [document.getElementById('heroVideoA'), document.getElementById('heroVideoB')];
    let activeVideoIndex = 0;
    let crossfadeRunning = false;
    let crossfadeTimer = null;
    const xpNumEl = document.getElementById('xpNum');
    const rateDotsEl = document.getElementById('rateDots');
    const levelEl = document.getElementById('level');
    const progressFillEl = document.getElementById('progressFill');
    const hpHudEl = document.getElementById('hpHud');
    const hpFillEl = document.getElementById('hpFill');
    const hpNumEl = document.getElementById('hpNum');
    const hpTrackEl = document.getElementById('hpTrack');
    const progressTrackEl = document.getElementById('levelProgress');
    const progressHudEl = document.getElementById('app');
    const motivationEmojiEl = document.getElementById('motivationEmoji');
    const motivationTextEl = document.getElementById('motivationText');
    const motivationClipTextEl = document.getElementById('motivationClipText');
    const progressLabelEl = document.getElementById('progressLabel');
    let currentMotivationTier = null;

    function performanceTier(state) {
      const tier = Number(state.performance_tier);
      if (Number.isInteger(tier) && tier >= 1 && tier <= 4) return tier;
      const rate = Number(state.performance_rate);
      if (!Number.isFinite(rate)) return 1;
      return rate >= 99.5 ? 4 : rate >= 66 ? 3 : rate >= 33 ? 2 : 1;
    }

    function readMotivationHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(MOTIVATION_HISTORY_KEY) || '[]');
        return Array.isArray(parsed) ? parsed.filter(item => typeof item === 'string').slice(-MOTIVATION_HISTORY_LIMIT) : [];
      } catch (_) { return []; }
    }

    function weightedPick(items) {
      const total = items.reduce((sum, item) => sum + Math.max(1, Number(item.weight) || 1), 0);
      let roll = Math.random() * total;
      for (const item of items) {
        roll -= Math.max(1, Number(item.weight) || 1);
        if (roll <= 0) return item;
      }
      return items[items.length - 1];
    }

    function chooseMotivation(tier) {
      const pool = MOTIVATION[tier] || MOTIVATION[1];
      const history = readMotivationHistory();
      const unseen = pool.filter(item => !history.includes(item.text));
      const candidates = unseen.length ? unseen : pool;
      const picked = weightedPick(candidates);
      const nextHistory = [...history, picked.text].slice(-MOTIVATION_HISTORY_LIMIT);
      try { localStorage.setItem(MOTIVATION_HISTORY_KEY, JSON.stringify(nextHistory)); } catch (_) {}
      return picked;
    }

    function motivationFontSize(text) {
      const length = text.length;
      if (length <= 16) return 15.4;
      if (length <= 23) return 14.2;
      if (length <= 31) return 12.9;
      if (length <= 39) return 11.7;
      return 10.6;
    }

    function splitMotivation(text) {
      const firstSpace = text.indexOf(' ');
      if (firstSpace <= 0) return { emoji:'✨', phrase:text };
      return { emoji:text.slice(0, firstSpace), phrase:text.slice(firstSpace + 1) };
    }

    function setMotivation(tier) {
      if (tier === currentMotivationTier) return;
      const message = chooseMotivation(tier);
      currentMotivationTier = tier;
      const parts = splitMotivation(message.text);
      const size = motivationFontSize(parts.phrase);
      motivationEmojiEl.textContent = parts.emoji;
      motivationTextEl.textContent = parts.phrase;
      motivationClipTextEl.textContent = parts.phrase;
      motivationTextEl.style.fontSize = size + 'px';
      motivationClipTextEl.style.fontSize = size + 'px';
      progressLabelEl.textContent = message.text;
      progressHudEl.dataset.rarity = message.rarity || 'common';
    }

    const VIDEO_FRAMING = {
      'Quest-Progress/main-quest-20260917-073323': 1.20
    };
    let loadedVideoKey = '';
    const XP_STORAGE_KEY = 'mainQuest.lastSeenXp.v1';
    const STAGE_STORAGE_KEY = 'mainQuest.lastSeenStage.v1';
    let lastSeenXp = null;
    let gainTimer;
    try {
      const saved = localStorage.getItem(XP_STORAGE_KEY);
      if (saved !== null && Number.isFinite(Number(saved))) lastSeenXp = Number(saved);
    } catch (_) {}

    function renderState(state) {
      const wholeLevel = Math.trunc(Number(state.level ?? state.display_level));
      levelEl.textContent = Number.isFinite(wholeLevel) && wholeLevel > 0 ? wholeLevel : '—';

      const currentXp = state.xp == null ? NaN : Number(state.xp);
      if (Number.isFinite(currentXp)) {
        const gain = lastSeenXp === null ? 0 : currentXp - lastSeenXp;
        if (gain > 0) {
          const toast = document.getElementById('xpGain');
          toast.textContent = '+' + gain.toLocaleString() + ' XP';
          toast.hidden = false;
          clearTimeout(gainTimer);
          gainTimer = setTimeout(() => { toast.hidden = true; }, 4000);
        }
        lastSeenXp = currentXp;
        try { localStorage.setItem(XP_STORAGE_KEY, String(currentXp)); } catch (_) {}
      }

      const curHp = Number(state.current_hp);
      const maxHp = Number(state.max_hp);
      let hpPct = NaN;
      if (Number.isFinite(curHp) && Number.isFinite(maxHp) && maxHp > 0) {
        hpPct = Math.max(0, Math.min(100, (curHp / maxHp) * 100));
        hpFillEl.style.width = hpPct + '%';
        hpNumEl.textContent = Math.round(curHp).toLocaleString() + ' / ' + Math.round(maxHp).toLocaleString();
        hpTrackEl.setAttribute('aria-valuenow', String(Math.round(hpPct)));
        hpHudEl.dataset.low = hpPct <= 30 ? '1' : '0';
        hpHudEl.hidden = false;
      } else {
        hpHudEl.hidden = true;
      }

      // Fill from XP within the level when available so the bar matches the readout;
      // level_progress (stage-weighted) is only the fallback.
      const levelXp = state.level_xp == null ? NaN : Number(state.level_xp);
      const levelXpMax = state.level_xp_max == null ? NaN : Number(state.level_xp_max);
      const hasLevelXp = Number.isFinite(levelXp) && Number.isFinite(levelXpMax) && levelXpMax > 0;
      const rawProgress = hasLevelXp ? (levelXp / levelXpMax) * 100 : Number(state.level_progress ?? state.progress ?? 0);
      const progress = Number.isFinite(rawProgress) ? Math.max(0, Math.min(100, rawProgress)) : 0;
      progressFillEl.style.width = progress + '%';
      progressTrackEl.setAttribute('aria-valuenow', String(Math.round(progress)));
      xpNumEl.textContent = hasLevelXp
        ? Math.round(levelXp).toLocaleString() + ' / ' + Math.round(levelXpMax).toLocaleString()
        : Math.round(progress) + '%';

      // Stage: which of the level's 4 stages you're in, a notch where each one
      // starts, and a one-time "Stage up!" when a new stage arrives within the level.
      const stage = Number(state.stage);
      const stageInLevel = Number(state.stage_in_level) || (Number.isFinite(stage) && stage > 0 ? ((stage - 1) % 4) + 1 : NaN);
      const stageTagEl = document.getElementById('stageTag');
      stageTagEl.hidden = !Number.isFinite(stageInLevel);
      if (!stageTagEl.hidden) stageTagEl.textContent = 'Stage ' + stageInLevel + '/4';
      progressTrackEl.querySelectorAll('.stage-notch').forEach(n => n.remove());
      const marks = hasLevelXp && Array.isArray(state.stage_marks) ? state.stage_marks.map(Number).filter(m => m > 0 && m < 100) : [];
      for (const m of marks) {
        const notch = document.createElement('span');
        notch.className = 'stage-notch' + (progress >= m ? ' is-passed' : '');
        notch.style.left = m + '%';
        progressTrackEl.appendChild(notch);
      }
      if (Number.isFinite(stage) && stage > 0) {
        let seen = null;
        try { const v = localStorage.getItem(STAGE_STORAGE_KEY); if (v !== null && Number.isFinite(Number(v))) seen = Number(v); } catch (_) {}
        const sameLevel = seen !== null && Math.floor((seen - 1) / 4) === Math.floor((stage - 1) / 4);
        if (sameLevel && stage > seen) {
          const toast = document.getElementById('xpGain');
          toast.textContent = (toast.hidden ? '' : toast.textContent + ' · ') + 'Stage up!';
          toast.hidden = false;
          clearTimeout(gainTimer);
          gainTimer = setTimeout(() => { toast.hidden = true; }, 4000);
          progressTrackEl.classList.remove('stage-up');
          void progressTrackEl.offsetWidth;
          progressTrackEl.classList.add('stage-up');
        }
        try { localStorage.setItem(STAGE_STORAGE_KEY, String(stage)); } catch (_) {}
      }

      // Success days in the last 3 journal entries; falls back to the 3-day average.
      const doneRaw = state.completed_count == null ? NaN : Number(state.completed_count);
      const usedRaw = state.entries_used == null ? NaN : Number(state.entries_used);
      const rate = Number(state.performance_rate);
      const done = Math.max(0, Math.min(3, Number.isFinite(doneRaw) ? doneRaw : Number.isFinite(rate) ? Math.round(rate / 100 * 3) : 0));
      const used = Number.isFinite(usedRaw) && usedRaw > 0 ? Math.min(3, usedRaw) : 3;
      Array.from(rateDotsEl.children).forEach((dot, i) => dot.classList.toggle('is-on', i < done));
      rateDotsEl.setAttribute('aria-label', 'Success on ' + done + ' of the last ' + used + ' days');

      renderPower(state.power, curHp, maxHp, hpPct);

      const tier = performanceTier(state);
      progressHudEl.dataset.tier = String(tier);
      progressHudEl.dataset.mood = PREVIEW_MOOD || heroMood(tier, hpPct);
      setMotivation(tier);
    }

    // ?mood=strong|steady|slipping previews a mood instead of the live one.
    const PREVIEW_MOOD = ['strong', 'steady', 'slipping'].find(m => m === new URLSearchParams(location.search).get('mood')) || '';

    // Strong = 3/3 Success days with HP above the low mark; slipping = 1/3 or fewer
    // Success days, or low HP (same 30% mark as the red HP bar); otherwise steady.
    function heroMood(tier, hpPct) {
      if (tier <= 2 || (Number.isFinite(hpPct) && hpPct <= 30)) return 'slipping';
      return tier === 4 ? 'strong' : 'steady';
    }

    function resetCrossfadeState() {
      crossfadeRunning = false;
      clearTimeout(crossfadeTimer);
      crossfadeTimer = null;
      activeVideoIndex = 0;
      videos.forEach((video, index) => {
        video.pause();
        try { video.currentTime = 0; } catch (_) {}
        video.classList.toggle('is-active', index === 0);
        video.style.zIndex = '0';
      });
    }

    function loadVideoPair(videoUrl, scale) {
      resetCrossfadeState();
      videos.forEach(video => {
        video.style.setProperty('--video-scale', String(scale));
        video.removeAttribute('src');
        video.load();
        video.src = videoUrl;
        video.load();
      });
      const first = videos[0];
      const startPlayback = () => first.play().catch(() => {});
      if (first.readyState >= 2) startPlayback();
      else first.addEventListener('canplay', startPlayback, { once: true });
    }

    function startCrossfade() {
      if (crossfadeRunning) return;
      const outgoing = videos[activeVideoIndex];
      const incomingIndex = 1 - activeVideoIndex;
      const incoming = videos[incomingIndex];
      if (!Number.isFinite(outgoing.duration) || outgoing.duration <= 0) return;

      crossfadeRunning = true;
      incoming.pause();
      try { incoming.currentTime = 0; } catch (_) {}
      incoming.classList.remove('is-active');
      outgoing.classList.add('is-active');
      outgoing.style.zIndex = '0';
      incoming.style.zIndex = '1';

      const beginFade = () => {
        incoming.play().then(() => {
          requestAnimationFrame(() => {
            incoming.classList.add('is-active');
          });
          crossfadeTimer = setTimeout(() => {
            outgoing.classList.remove('is-active');
            outgoing.pause();
            try { outgoing.currentTime = 0; } catch (_) {}
            incoming.style.zIndex = '0';
            outgoing.style.zIndex = '0';
            activeVideoIndex = incomingIndex;
            crossfadeRunning = false;
            crossfadeTimer = null;
          }, CROSSFADE_MS + 40);
        }).catch(() => {
          incoming.style.zIndex = '0';
          crossfadeRunning = false;
        });
      };

      if (incoming.readyState >= 2) beginFade();
      else incoming.addEventListener('canplay', beginFade, { once: true });
    }

    function monitorVideoLoop() {
      const active = videos[activeVideoIndex];
      if (!crossfadeRunning && active.readyState >= 2 && Number.isFinite(active.duration) && active.duration > 0) {
        const remainingMs = (active.duration - active.currentTime) * 1000;
        if (active.currentTime > 0 && remainingMs <= CROSSFADE_MS + CROSSFADE_LEAD_MS) startCrossfade();
      }
      requestAnimationFrame(monitorVideoLoop);
    }

    async function refreshDashboard() {
      try {
        const [response, boss] = await Promise.all([
          fetch(`${STATE_URL}?t=${Date.now()}`, { cache: 'no-store' }),
          fetch(BOSS_URL, { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null)
        ]);
        if (!response.ok) return;

        const state = await response.json();
        // data.json's HP is only refreshed by the nightly runs; the live value wins.
        if (boss && Number(boss.hero_max_hp) > 0) {
          state.current_hp = Number(boss.hero_hp);
          state.max_hp = Number(boss.hero_max_hp);
        }
        renderState(state);

        const videoUrl = state.video_url || '';
        const videoKey = String(state.video_public_id || state.video_version || videoUrl);
        const framingId = state.video_public_id || videoUrl.split('/').slice(-2).join('/').replace(/\.mp4(?:\?.*)?$/, '');
        const scale = VIDEO_FRAMING[framingId] || 1;
        videos.forEach(video => video.style.setProperty('--video-scale', String(scale)));

        if (videoUrl && videoKey !== loadedVideoKey) {
          loadedVideoKey = videoKey;
          loadVideoPair(videoUrl, scale);
        }
      } catch (error) {
        console.error('Dashboard refresh failed', error);
      }
    }


    // ---- The back of the card: Goku's journey so far ----
    // The hero card is rebuilt nightly by the Quest Engine Worker. It only ever
    // holds the past: forms already reached, logged days and records.
    const HERO_URL = ENGINE_URL + '/hero';
    const CLOUD = 'https://res.cloudinary.com/a3xk0plk/video/upload/';
    const READING_HISTORY_KEY = 'mainQuest.scouterHistory.v1';
    const RARE_CHANCE = 0.12;
    const flipperEl = document.getElementById('flipper');
    const backEl = document.getElementById('heroBack');
    const readingEl = document.getElementById('reading');
    const scouterEl = document.getElementById('scouter');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let hero = null;
    let flipTimer = null;
    let typeTimer = null;

    const fmtNum = n => Math.round(Number(n) || 0).toLocaleString();
    const dayMs = key => Date.parse(key + 'T12:00:00Z');
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const fmtDay = (key, withWeekday) => {
      const t = dayMs(key);
      if (isNaN(t)) return '';
      const d = new Date(t);
      return (withWeekday ? WEEKDAYS[d.getUTCDay()] + ' ' : '') + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()];
    };
    const todayKey = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Amsterdam', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    const questDay = () => hero && hero.started ? Math.round((dayMs(todayKey()) - dayMs(hero.started)) / 86400000) + 1 : null;
    const still = f => f.video_public_id && f.video_version ? CLOUD + 'so_1.5,w_360,h_480,c_fill,g_north/v' + f.video_version + '/' + f.video_public_id + '.jpg' : '';
    // Same crop and start frame as the still, so the clip takes over without a jump.
    const clip = f => f.video_public_id && f.video_version ? CLOUD + 'ac_none,so_1.5,w_540,h_720,c_fill,g_north/v' + f.video_version + '/' + f.video_public_id + '.mp4' : '';
    const pick = list => list[Math.floor(Math.random() * list.length)];
    const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    // hero.json is built at 04:00, so today's heals and hits come live from the boss card's
    // log (BOSS_URL above), summed per game day (04:00 Amsterdam rollover).
    const gameDay = ms => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Amsterdam', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms - 4 * 3600000));
    let liveHeal = { day: '', hp: 0, damage: 0 };

    async function loadLiveHeal() {
      try {
        const response = await fetch(`${BOSS_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) return;
        const boss = await response.json();
        const day = gameDay(Date.now());
        const today = (Array.isArray(boss.log) ? boss.log : []).filter(e => { const at = Date.parse(e && e.at); return !isNaN(at) && gameDay(at) === day; });
        const hp = today.reduce((sum, e) => sum + Math.max(0, Number(e.heal) || 0), 0);
        const damage = today.reduce((sum, e) => sum + (e.kind === 'hero' ? Math.max(0, Number(e.damage) || 0) : 0), 0);
        liveHeal = { day: day, hp: hp, damage: damage };
      } catch (error) { /* the boss card is optional here */ }
    }

    async function loadHero() {
      try {
        const [response] = await Promise.all([fetch(`${HERO_URL}?t=${Date.now()}`, { cache: 'no-store' }), loadLiveHeal()]);
        if (response.ok) hero = await response.json();
      } catch (error) { console.error('Hero card refresh failed', error); }
      renderBack();
    }

    function renderBack() {
      const forms = (hero && Array.isArray(hero.forms)) ? hero.forms : [];
      const now = forms[forms.length - 1];
      document.getElementById('hbForm').textContent = now && now.form ? 'Goku · ' + now.form : 'Goku';
      document.getElementById('hbLevel').textContent = hero && hero.level ? hero.level : (levelEl.textContent || '—');
      const day = questDay();
      document.getElementById('hbSub').textContent = day ? 'Day ' + day + ' of the quest' : '';
      renderRecords();
      renderForms(forms);
      renderDays();
      renderLore(forms);
    }

    function renderRecords() {
      const el = document.getElementById('records');
      const r = hero && hero.records;
      if (!r) { el.innerHTML = ''; return; }
      const cells = [
        [r.current_run, r.current_run === 1 ? 'Day of success' : 'Success days in a row'],
        [r.best_gain ? '+' + fmtNum(r.best_gain.gain) : '—', 'Best day' + (r.best_gain ? ' · ' + fmtDay(r.best_gain.date) : '')],
        [r.movement_days, 'Success days'],
        [r.longest_run, 'Longest run']
      ];
      el.innerHTML = cells.map(([n, label]) => `<div class="record"><div class="record-num">${esc(n)}</div><span class="label">${esc(label)}</span></div>`).join('');
    }

    let formsKey = '';
    function renderForms(forms) {
      const el = document.getElementById('forms');
      const key = JSON.stringify(forms);
      if (key === formsKey && el.children.length) return;
      formsKey = key;
      if (!forms.length) { el.innerHTML = '<div class="empty">Your forms appear here after tonight’s run.</div>'; return; }
      el.innerHTML = forms.slice().reverse().map((f, i) => `
        <div class="form" data-level="${esc(f.level)}" style="background-image:url('${esc(still(f))}')" role="button" tabindex="0" aria-label="${esc(f.form)}, reached ${esc(fmtDay(f.reached))}. Tap for its story.">
          ${i === 0 ? '<span class="form-now">Now</span>' : ''}
          <div class="form-cap"><div class="form-name">${esc(f.form)}</div><div class="form-meta">Level ${esc(f.level)}${f.reached ? ' · ' + esc(fmtDay(f.reached)) : ''}</div></div>
        </div>`).join('');
    }

    function toggleFormClip(tile) {
      const f = (hero.forms || []).find(x => String(x.level) === tile.dataset.level);
      const playing = tile.querySelector('video');
      document.querySelectorAll('.form video').forEach(v => v.remove());
      if (playing || !f || !clip(f)) return;
      const video = document.createElement('video');
      Object.assign(video, { src: clip(f), muted: true, loop: true, playsInline: true, autoplay: true });
      video.setAttribute('playsinline', '');
      // Stay invisible over the still until frames are actually showing: no black flash.
      video.addEventListener('playing', () => video.classList.add('ready'), { once: true });
      tile.insertBefore(video, tile.firstChild);
      video.play().catch(() => {});
    }

    function renderDays() {
      const el = document.getElementById('days');
      const days = (hero && Array.isArray(hero.days)) ? hero.days : [];
      if (!days.length) { el.innerHTML = '<li class="empty">Your days appear here after tonight’s run.</li>'; return; }
      const today = todayKey();
      el.innerHTML = days.map(d => {
        // Today's Success is ticked later in the day, so no verdict on it yet.
        const pills = [d.movement ? '<span class="pill moved">Success</span>' : d.date === today ? '<span class="pill">Today</span>' : '<span class="pill rest">No success</span>'];
        if (d.workouts) pills.push(`<span class="pill">${d.workouts > 1 ? d.workouts + ' workouts' : '1 workout'}</span>`);
        if (d.level_up) pills.push(`<span class="pill up">Level ${esc(d.level)}</span>`);
        else if (d.stage_up) pills.push(`<span class="pill">Stage ${esc(d.stage)}</span>`);
        const healed = Math.max(Number(d.healed) || 0, d.date === liveHeal.day ? liveHeal.hp : 0);
        const hp = (Number(d.restored) || 0) + healed;
        if (hp > 0) {
          const why = [d.restored > 0 ? `${fmtNum(d.restored)} overnight` : '', healed > 0 ? `${fmtNum(healed)} from habits` : ''].filter(Boolean).join(' · ');
          pills.push(`<span class="pill hp" title="${esc(why)}">💚 +${fmtNum(hp)} HP</span>`);
        }
        // Damage taken from bad habits that day.
        const hurt = Math.max(Number(d.damaged) || 0, d.date === liveHeal.day ? liveHeal.damage : 0);
        if (hurt > 0) pills.push(`<span class="pill dmg" title="Damage taken from bad habits">💢 −${fmtNum(hurt)} HP</span>`);
        const xp = d.gain == null ? '<span class="day-xp pending">counts at 04:00</span>' : `<span class="day-xp">+${fmtNum(d.gain)} XP</span>`;
        return `<li class="day"><span class="day-date">${esc(fmtDay(d.date, true))}</span><span class="day-what">${pills.join('')}</span>${xp}</li>`;
      }).join('');
    }

    // ---- Lore: the current form's story on the Lore tab; any reached form's from its tile ----
    // The story is the form's Lore in D1 (goku.lore), carried in hero.json only
    // once the form is reached, so nothing here gives away what comes next.
    const loreFacts = f => [f.reached ? 'Reached ' + fmtDay(f.reached) : '', f.move || ''].filter(Boolean);
    const loreHtml = (f, now) => `
      <div class="lore-epithet">Chapter ${esc(f.level)}${now ? ' · Now' : ''}</div>
      <div class="lore-name">Goku · ${esc(f.form)}</div>
      <p class="lore-text">${esc(f.lore || 'No lore recorded for this form yet.')}</p>
      <div class="lore-facts">${loreFacts(f).map(x => `<span>${esc(x)}</span>`).join('')}</div>`;

    function renderLore(forms) {
      const f = forms[forms.length - 1];
      document.getElementById('loreEpithet').textContent = f ? 'Chapter ' + f.level + ' · Now' : '';
      document.getElementById('loreName').textContent = f && f.form ? 'Goku · ' + f.form : 'Goku';
      document.getElementById('loreText').textContent = (f && f.lore) || (f ? 'No lore recorded for this form yet.' : 'Your story appears here after tonight’s run.');
      document.getElementById('loreFacts').replaceChildren(...(f ? loreFacts(f) : []).map(fact => {
        const span = document.createElement('span');
        span.textContent = fact;
        return span;
      }));
    }

    // A form's tile opens its story: the clip plays above it. Back returns to the grid.
    function openForm(level) {
      const forms = (hero && Array.isArray(hero.forms)) ? hero.forms : [];
      const f = forms.find(x => String(x.level) === String(level));
      if (!f) return;
      const now = f === forms[forms.length - 1];
      document.querySelectorAll('.form video').forEach(v => v.remove());
      const detail = document.getElementById('formDetail');
      detail.innerHTML = `<button class="form-back" type="button" id="formBack">← All forms</button>
        <div class="form form-big" data-level="${esc(f.level)}" style="background-image:url('${esc(still(f))}')" role="button" tabindex="0" aria-label="${esc(f.form)}. Tap to replay.">
          ${now ? '<span class="form-now">Now</span>' : ''}
        </div>
        <div class="lore">${loreHtml(f, now)}</div>`;
      document.getElementById('forms').hidden = true;
      detail.hidden = false;
      document.getElementById('panelForms').scrollTop = 0;
      toggleFormClip(detail.querySelector('.form'));
    }

    function closeForm() {
      document.querySelectorAll('.form video').forEach(v => v.remove());
      const detail = document.getElementById('formDetail');
      if (detail.hidden) return;
      detail.hidden = true;
      detail.innerHTML = '';
      document.getElementById('forms').hidden = false;
    }

    // One reading per flip, never one of the last few. Now and then a rare one.
    function readings() {
      const r = (hero && hero.records) || {};
      const forms = (hero && hero.forms) || [];
      const days = (hero && hero.days) || [];
      const common = [], rare = [];
      const xp = Number(r.xp || 0);
      if (xp) common.push(xp > 9000 ? `Power reading: ${fmtNum(xp)} XP. It's over 9000!` : `Power reading: ${fmtNum(xp)} XP.`);
      if (r.current_run > 1) common.push(`${r.current_run} success days in a row.`);
      if (r.best_gain) common.push(`Biggest day so far: ${fmtDay(r.best_gain.date)}, +${fmtNum(r.best_gain.gain)} XP.`);
      if (r.movement_days) common.push(`${r.movement_days} success days since ${fmtDay(hero.started)}.`);
      if (r.workouts) common.push(`${r.workouts} workouts logged on the quest.`);
      if (r.longest_run > 2) common.push(`Longest run: ${r.longest_run} success days without a break.`);
      if (r.fastest_level) common.push(`Fastest transformation: ${r.fastest_level.form} in ${r.fastest_level.days} days.`);
      if (r.stage) common.push(`Stage ${r.stage} of the Main Quest, cleared by showing up.`);
      const day = questDay();
      if (day) common.push(`Day ${day} of the quest. Still standing.`);
      const earned = days.find(d => d.gain != null);
      if (earned && earned.gain) common.push(`${fmtDay(earned.date, true)} earned you +${fmtNum(earned.gain)} XP.`);
      for (const f of forms.slice(0, -1)) if (f.reached) common.push(`Flashback: on ${fmtDay(f.reached)} you became ${f.form}.`);
      if (forms.length > 1 && forms[0].reached) rare.push(`Memory unlocked: ${fmtDay(forms[0].reached)}, the day it all started as ${forms[0].form}. Look at you now.`);
      // Goku's power (from the Goku card's state).
      if (power) {
        const pl = Number(power.power_level) || 0, ch = power.trend_change_pct, g = power.gravity || {};
        if (pl) common.push(pl > 9000 ? `Power level ${fmtNum(pl)}. It's over 9000!` : `Power level ${fmtNum(pl)}${ch > 0 ? `, up ${ch}% in twelve weeks` : ''}.`);
        if (g.days) common.push(`Gravity ${fmtNum(g.gravity)}×: ${g.days} training days in the last 28.`);
        if (power.next_mark) common.push(`Next signature move at power ${fmtNum(power.next_mark.power)}. ${fmtNum(Math.max(0, power.next_mark.power - pl))} to go.`);
        if (power.week && power.week.senzu) rare.push('Six hours this week. The Senzu bean is yours.');
      }
      rare.push('Reading unstable… the scouter just cracked.', 'The only one you need to beat is the you from yesterday.', 'Power comes in response to a need, not a desire.', 'A Saiyan never stops at their limit.', 'Somewhere, Vegeta just clenched his fist.');
      return { common: common, rare: rare };
    }

    function nextReading() {
      const pool = readings();
      if (!pool.common.length) return { text: 'Scouter calibrating… come back after tonight’s run.', rare: false };
      let history = [];
      try { history = JSON.parse(localStorage.getItem(READING_HISTORY_KEY) || '[]'); } catch (_) {}
      if (!Array.isArray(history)) history = [];
      const isRare = Math.random() < RARE_CHANCE;
      const list = isRare ? pool.rare : pool.common;
      const fresh = list.filter(t => !history.includes(t));
      const text = pick(fresh.length ? fresh : list);
      try { localStorage.setItem(READING_HISTORY_KEY, JSON.stringify([...history, text].slice(-6))); } catch (_) {}
      return { text: text, rare: isRare };
    }

    function showReading() {
      const reading = nextReading();
      scouterEl.classList.toggle('rare', reading.rare);
      document.getElementById('scouterLabel').textContent = reading.rare ? '⚡ Rare reading' : 'Scouter reading';
      clearInterval(typeTimer);
      if (reduceMotion) { readingEl.textContent = reading.text; return; }
      // Typed out like a scouter readout.
      let i = 0;
      readingEl.textContent = '';
      readingEl.classList.add('typing');
      typeTimer = setInterval(() => {
        i += 1;
        readingEl.textContent = reading.text.slice(0, i);
        if (i >= reading.text.length) { clearInterval(typeTimer); readingEl.classList.remove('typing'); }
      }, 28);
    }

    // ---- Goku's power (quest-engine src/power.js, 2 Oct 2026) ----
    // Each part drives one thing: gravity -> XP, signature moves -> attack,
    // the ki shield -> shield, the 6-hour week's Senzu bean -> HP.
    const SENZU_SEEN_KEY = 'mainQuest.senzuSeen.v1';
    const senzuEl = document.getElementById('senzu');
    let power = null;
    let powerKey = '';
    let senzuTimer = null;

    function renderPower(p, curHp, maxHp, hpPct) {
      power = p && typeof p === 'object' ? p : null;
      const shieldEl = document.getElementById('hpShield');
      if (!power) {
        shieldEl.style.width = '0';
        hpHudEl.dataset.shield = '0';
        progressHudEl.dataset.ultra = '0';
        renderScouterPower();
        return;
      }

      // 🛡️ The ki shield sits on the HP bar after the HP, and bad habits hit it first.
      // The front shows nothing else of the power (Roy: the animation stays clear).
      const amount = Math.max(0, Math.round(Number(power.shield && power.shield.amount) || 0));
      hpHudEl.dataset.shield = amount > 0 ? '1' : '0';
      if (amount > 0 && Number.isFinite(hpPct) && maxHp > 0) {
        shieldEl.style.left = hpPct + '%';
        shieldEl.style.width = Math.min((amount / maxHp) * 100, 100 - hpPct) + '%';
        hpNumEl.innerHTML = esc(hpNumEl.textContent) + ' <span class="hp-shield-num">+' + esc(fmtNum(amount)) + '</span>';
      } else {
        shieldEl.style.width = '0';
      }

      // 🫘 The 6-hour week: silver until Sunday night, and the Senzu banner once.
      const week = power.week || {};
      progressHudEl.dataset.ultra = week.senzu ? '1' : '0';
      let seen = '';
      try { seen = localStorage.getItem(SENZU_SEEN_KEY) || ''; } catch (_) {}
      if (week.senzu && week.monday && seen !== week.monday && senzuEl.hidden) {
        document.getElementById('senzuText').textContent = (Number(week.hours) || 0) + ' h trained this week';
        senzuEl.hidden = false;
        try { localStorage.setItem(SENZU_SEEN_KEY, week.monday); } catch (_) {}
        clearTimeout(senzuTimer);
        senzuTimer = setTimeout(() => { senzuEl.hidden = true; }, 9000);
      }
      renderScouterPower();
      if (!document.getElementById('panelMoves').hidden) renderMoves();
    }

    senzuEl.addEventListener('click', event => { event.stopPropagation(); senzuEl.hidden = true; });

    const smallImage = url => String(url || '').replace('/image/upload/', '/image/upload/w_360,h_480,c_fill,g_north,f_auto/');
    const smallClip = url => String(url || '').replace(/\/video\/upload\/(ac_none,so_1\.0\/)?/, '/video/upload/ac_none,w_540,h_720,c_fill,g_north/');
    const MOVE_BADGE = { charged: 'Charged', used: 'Used this week', dormant: 'Dormant', awake: 'Awake' };

    function sparkPath(values) {
      const v = values.map(x => Number(x) || 0);
      if (v.length < 2) return '';
      // Scaled to its own range, so a few weeks of progress show as a climb.
      const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
      return v.map((y, i) => (i ? 'L' : 'M') + Math.round((i / (v.length - 1)) * 240) + ' ' + Math.round(hi === lo ? 18 : 33 - ((y - lo) / span) * 28)).join(' ');
    }

    // Scouter tab: power level, its 12 weeks and the move marks inside the
    // scouter box; gravity and this week as two tiles under it.
    function renderScouterPower() {
      const box = document.getElementById('scPower');
      const cells = document.getElementById('powerCells');
      if (!power) { box.hidden = true; cells.hidden = true; return; }
      const pl = Number(power.power_level) || 0;
      const line = sparkPath(Array.isArray(power.trend) ? power.trend : []);
      const change = power.trend_change_pct;
      const marks = (Array.isArray(power.marks) ? power.marks : []).map(Number).filter(m => m > 0);
      const top = marks.length ? Math.max(...marks) * 1.08 : Math.max(pl, 1);
      const next = power.next_mark;
      const moves = Array.isArray(power.moves) ? power.moves : [];
      const gauge = marks.map(m => {
        const mv = moves.find(x => Number(x.power) === m) || {};
        const isNext = next && Number(next.power) === m;
        const left = Math.min(100, (m / top) * 100);
        return `<span class="g-mark${pl >= m ? ' on' : isNext ? ' next' : ''}" style="left:${left}%"></span>` +
          (isNext ? `<span class="g-lab next" style="left:${left}%">${esc(mv.name || '???')} · ${esc(fmtNum(m))}</span>` : '');
      }).join('');
      box.innerHTML =
        `<span class="label">Power level · fitness × 100</span>` +
        `<div><span class="pl-big">${esc(fmtNum(pl))}</span>${change !== null && change !== undefined ? `<span class="pl-trend${change < 0 ? ' down' : ''}">${change < 0 ? '▼' : '▲'} ${esc(Math.abs(change))}% in 12 wk</span>` : ''}</div>` +
        (line ? `<svg class="spark" viewBox="0 0 240 36" preserveAspectRatio="none" aria-hidden="true"><path d="${line} L240 36 L0 36Z" fill="rgba(125,255,176,.16)"/><path d="${line}" fill="none" stroke="#7dffb0" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>` : '') +
        (marks.length ? `<div class="gauge"><div class="gauge-fill" style="width:${Math.min(100, (pl / top) * 100)}%"></div>${gauge}</div>` : '');
      box.hidden = false;

      const g = power.gravity || {};
      const cal = (Array.isArray(g.calendar) ? g.calendar : []).map((d, i, all) => `<span class="${d ? 't' : ''}${i === all.length - 1 ? ' today' : ''}"></span>`).join('');
      const week = power.week || {};
      const hrs = Math.floor((Number(week.minutes) || 0) / 60), mins = (Number(week.minutes) || 0) % 60;
      cells.innerHTML =
        `<div class="pcell gv"><div class="pcell-num">${esc(fmtNum(g.gravity))}×</div><span class="label">Gravity · +${esc(Math.round((Number(g.xp_bonus) || 0) * 1000) / 10)}% XP</span><div class="cal" title="${esc(g.days || 0)} training days in the last 28">${cal}</div></div>` +
        `<div class="pcell wk"><div class="pcell-num">${hrs} h ${String(mins).padStart(2, '0')}</div><span class="label">This week · ${week.senzu ? '🫘 Senzu earned' : '🫘 at 6 h'}</span></div>`;
      cells.hidden = false;
    }

    // Moves tab: the four signature moves.
    function renderMoves() {
      const el = document.getElementById('moves');
      if (!power) { el.innerHTML = '<div class="empty">No power reading yet.</div>'; powerKey = ''; return; }
      const moves = Array.isArray(power.moves) ? power.moves : [];
      const key = JSON.stringify(moves);
      if (key === powerKey) return; // keeps a playing move clip running
      powerKey = key;
      const tiles = moves.map(m => {
        if (m.state === 'locked') {
          return `<div class="move locked"><div class="move-lock">🔒</div><div class="move-cap"><div class="move-name">???</div><div class="move-meta">Power ${esc(fmtNum(m.power))}</div></div></div>`;
        }
        const making = !m.image_url && !m.video_url;
        const bg = m.image_url ? ` style="background-image:url('${esc(smallImage(m.image_url))}')"` : '';
        const badge = making ? '<span class="move-badge making">Being drawn</span>' : MOVE_BADGE[m.state] ? `<span class="move-badge ${esc(m.state)}">${MOVE_BADGE[m.state]}</span>` : '';
        return `<div class="move ${esc(m.state)}" data-key="${esc(m.key)}" role="button" tabindex="0" aria-label="${esc(m.name)}"${bg}>${badge}<div class="move-cap"><div class="move-name">${esc(m.name)}</div><div class="move-meta">${esc(fmtNum(m.power))} · ×${esc(m.mult)} on a workout</div></div></div>`;
      }).join('');
      el.innerHTML = `<div class="moves">${tiles}</div>` +
        `<div class="power-note">A move unlocks when your power level reaches its mark. The strongest awake move charges every Monday and fires by itself on your next Strava workout. If your power drops below a move's mark it sleeps until you train back up. Tap a move to play it.</div>`;
    }

    function toggleMoveClip(tile) {
      const m = (power && Array.isArray(power.moves) ? power.moves : []).find(x => x.key === tile.dataset.key);
      const playing = tile.querySelector('video');
      document.querySelectorAll('.move video').forEach(v => v.remove());
      if (playing || !m || !m.video_url) return;
      const video = document.createElement('video');
      Object.assign(video, { src: smallClip(m.video_url), muted: true, loop: true, playsInline: true, autoplay: true });
      video.setAttribute('playsinline', '');
      video.addEventListener('playing', () => video.classList.add('ready'), { once: true });
      tile.insertBefore(video, tile.firstChild);
      video.play().catch(() => {});
    }

    function selectTab(id) {
      document.querySelectorAll('.tab').forEach(tab => {
        const on = tab.id === id;
        tab.setAttribute('aria-selected', String(on));
        document.getElementById(tab.getAttribute('aria-controls')).hidden = !on;
      });
      if (id !== 'tabForms') closeForm();
      if (id === 'tabMoves') renderMoves();
      else document.querySelectorAll('.move video').forEach(v => v.remove());
    }

    function setFlipped(flipped) {
      const flipMs = reduceMotion ? 0 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--flip-ms')) || 1100;
      flipperEl.classList.toggle('is-flipped', flipped);
      progressHudEl.setAttribute('aria-hidden', String(flipped));
      backEl.setAttribute('aria-hidden', String(!flipped));
      clearTimeout(flipTimer);
      flipTimer = setTimeout(() => flipperEl.classList.toggle('show-back', flipped), flipMs / 2);
      if (flipped) {
        renderBack();
        showReading();
        loadHero();
        document.querySelectorAll('.panel').forEach(p => { p.scrollTop = 0; });
        setTimeout(() => videos.forEach(v => v.pause()), flipMs);
      } else {
        closeForm();
        videos[activeVideoIndex].play().catch(() => {});
      }
    }

    progressHudEl.addEventListener('click', () => setFlipped(true));
    progressHudEl.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); setFlipped(true); }
    });
    backEl.addEventListener('click', event => {
      const tab = event.target.closest('.tab');
      if (tab) { selectTab(tab.id); return; }
      if (event.target.closest('#formBack')) { closeForm(); return; }
      const move = event.target.closest('.move[data-key]');
      if (move) { toggleMoveClip(move); return; }
      const tile = event.target.closest('.form');
      if (tile) { if (tile.classList.contains('form-big')) toggleFormClip(tile); else openForm(tile.dataset.level); return; }
      if (event.target.closest('#hbHead, #hbHint')) setFlipped(false);
    });
    backEl.addEventListener('keydown', event => {
      const move = event.target.closest('.move[data-key]');
      if (move && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); toggleMoveClip(move); return; }
      const tile = event.target.closest('.form');
      if (tile && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); if (tile.classList.contains('form-big')) toggleFormClip(tile); else openForm(tile.dataset.level); }
      if (event.key === 'Escape') setFlipped(false);
    });
    // Browsers pause muted video in a hidden tab; pick the front back up.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !flipperEl.classList.contains('is-flipped')) videos[activeVideoIndex].play().catch(() => {});
    });

    monitorVideoLoop();
    loadHero();
    refreshDashboard();
    setInterval(refreshDashboard, REFRESH_MS);
  </script>
</body>
</html>
