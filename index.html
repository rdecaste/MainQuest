<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Main Quest</title>
  <style>
    :root {
      --bg:#05070b;
      --text:#fff;
      --muted:rgba(255,255,255,.72);
      --accent-a:#ff9f1c;
      --accent-b:#ffd54a;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body{width:100vw;height:100vh;height:100dvh}
    .app{position:absolute;inset:0;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;background:var(--bg);--rate-color:#b7773d;--rate-a:#8d5524;--rate-b:#d59656;--rate-glow:rgba(191,119,57,.28);--flow-duration:9s;--flow-opacity:.08;--bar-glow:0 0 4px rgba(183,119,61,.22);--pulse-duration:9s;--label-glow-radius:3px;--label-pulse-duration:9s;--label-shimmer-duration:12s;--label-shimmer-opacity:.06;--word-a:#74421f;--word-b:#b7773d;--word-c:#e0a56b;--word-glow:rgba(183,119,61,.28)}
    .hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:var(--bg);display:block;transform:scale(var(--video-scale,1));transform-origin:center;opacity:0;transition:opacity 1200ms linear;will-change:opacity;pointer-events:none;z-index:0}
    .hero-video.is-active{opacity:1}
    /* Hero mood mirrors the quest: same video, lit up on strong days, dimmed when slipping.
       Plain overlays only, so the video element itself is never restyled. Playback speed is
       never changed, so his breathing stays a steady pace to follow. Preview with ?mood=. */
    .hero-glow,.hero-shade{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 2s ease}
    .hero-glow{background:radial-gradient(ellipse 60% 45% at 50% 42%,rgba(255,210,120,.22),transparent 70%)}
    .hero-shade{background:radial-gradient(ellipse 75% 60% at 50% 45%,rgba(40,42,50,.38) 0%,rgba(20,22,28,.5) 55%,rgba(0,0,0,.72) 100%)}
    .app[data-mood="strong"] .hero-glow{opacity:1;animation:hero-glow 4s ease-in-out infinite}
    .app[data-mood="slipping"] .hero-shade{opacity:1}
    @keyframes hero-glow{0%,100%{opacity:.55}50%{opacity:1}}
    .hud-top{position:absolute;top:calc(12px + var(--safe-top));left:calc(12px + var(--safe-left));right:calc(12px + var(--safe-right));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:2;pointer-events:none}
    .metric.right{flex:0 0 auto;text-align:right}
    .label{font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 4px rgba(0,0,0,.85)}
    .value{margin-top:3px;font-size:clamp(23px,6.5vw,31px);line-height:1;font-weight:850;letter-spacing:-.04em;text-shadow:0 1px 6px rgba(0,0,0,.9)}
    .hud-bottom{position:absolute;left:calc(12px + var(--safe-left));right:calc(12px + var(--safe-right));bottom:calc(14px + var(--safe-bottom));z-index:2;pointer-events:none}
    .app[data-tier="2"]{--rate-color:#d6d9df;--rate-a:#9fa7b2;--rate-b:#eef2f7;--rate-glow:rgba(220,226,236,.38);--flow-duration:6.5s;--flow-opacity:.20;--bar-glow:0 0 7px rgba(214,219,228,.34);--pulse-duration:6.5s;--label-glow-radius:5px;--label-pulse-duration:6.5s;--label-shimmer-duration:8.5s;--label-shimmer-opacity:.18;--word-a:#8d95a0;--word-b:#d6d9df;--word-c:#ffffff;--word-glow:rgba(220,226,236,.45)}
    .app[data-tier="3"]{--rate-color:#ffd65c;--rate-a:#c99318;--rate-b:#ffe985;--rate-glow:rgba(255,211,72,.54);--flow-duration:3.8s;--flow-opacity:.34;--bar-glow:0 0 11px rgba(255,211,72,.48);--pulse-duration:4.4s;--label-glow-radius:8px;--label-pulse-duration:4.4s;--label-shimmer-duration:5.5s;--label-shimmer-opacity:.32;--word-a:#a26c0d;--word-b:#ffd65c;--word-c:#fff3a1;--word-glow:rgba(255,211,72,.60)}
    .app[data-tier="4"]{--rate-color:#6fd5ff;--rate-a:#1597e5;--rate-b:#a8ecff;--rate-glow:rgba(61,190,255,.74);--flow-duration:1.9s;--flow-opacity:.56;--bar-glow:0 0 16px rgba(42,184,255,.68),0 0 28px rgba(42,184,255,.24);--pulse-duration:2.6s;--label-glow-radius:12px;--label-pulse-duration:2.6s;--label-shimmer-duration:3.2s;--label-shimmer-opacity:.56;--word-a:#0b7dcb;--word-b:#6fd5ff;--word-c:#d5f6ff;--word-glow:rgba(61,190,255,.78)}
    .app[data-rarity="rare"] .progress-wordmark{filter:drop-shadow(0 1px 2px rgba(0,0,0,.9)) drop-shadow(0 0 calc(var(--label-glow-radius) + 4px) var(--word-glow)) drop-shadow(0 0 12px var(--word-glow))}
    .app[data-rarity="epic"] .progress-wordmark{filter:drop-shadow(0 1px 2px rgba(0,0,0,.95)) drop-shadow(0 0 calc(var(--label-glow-radius) + 6px) var(--word-glow)) drop-shadow(0 0 18px var(--word-glow)) drop-shadow(0 0 28px var(--word-glow))}
    .bar-row + .bar-row{margin-top:11px}
    .bar-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
    .bar-num{font-size:12px;font-weight:850;letter-spacing:-.01em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.9);font-variant-numeric:tabular-nums}
    .hp-track{width:100%;height:6px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.18)}
    .hp-fill{width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#3ddc84,#8ef0b4);transition:width 300ms ease}
    .hp-row[data-low="1"] .hp-fill{background:linear-gradient(90deg,#ff5f5f,#ff9f1c)}
    .motivation-line{display:flex;align-items:center;gap:7px;min-width:0;padding-top:4px}
    .motivation-emoji{flex:0 0 auto;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:20px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9));transform:translateY(-1px)}
    .progress-wordmark{width:min(calc(100vw - 130px),252px);height:28px;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.9)) drop-shadow(0 0 calc(var(--label-glow-radius) + 3px) var(--word-glow)) drop-shadow(0 0 10px var(--word-glow));animation:label-pulse var(--label-pulse-duration) ease-in-out infinite}
    .progress-wordmark text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;font-weight:760;letter-spacing:.25px;fill:url(#wordGradient);paint-order:stroke fill;stroke:rgba(0,0,0,.22);stroke-width:.35px}
    .progress-wordmark .word-stop-a{stop-color:var(--word-a)}
    .progress-wordmark .word-stop-b{stop-color:var(--word-b)}
    .progress-wordmark .word-stop-c{stop-color:var(--word-c)}
    .progress-wordmark .word-shimmer{fill:url(#shimmerGradient);opacity:var(--label-shimmer-opacity);mix-blend-mode:screen;animation:svg-shimmer var(--label-shimmer-duration) linear infinite}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .progress-track{width:100%;height:6px;overflow:visible;border-radius:999px;background:rgba(255,255,255,.18)}
    .progress-fill{position:relative;width:0%;height:100%;overflow:hidden;border-radius:inherit;background:linear-gradient(90deg,var(--rate-a),var(--rate-b));box-shadow:var(--bar-glow);transition:width 300ms ease;animation:bar-pulse var(--pulse-duration) ease-in-out infinite}
    .progress-fill::after{content:"";position:absolute;top:0;bottom:0;left:-45%;width:42%;background:linear-gradient(90deg,transparent,rgba(255,255,255,var(--flow-opacity)),transparent);transform:skewX(-18deg);animation:bar-flow var(--flow-duration) linear infinite}
    @keyframes bar-flow{from{left:-45%}to{left:110%}}
    @keyframes bar-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.10)}}
    @keyframes label-pulse{0%,100%{opacity:.94;filter:brightness(.98)}50%{opacity:1;filter:brightness(1.09)}}
    @keyframes svg-shimmer{from{transform:translateX(-260px)}to{transform:translateX(280px)}}
    .xp-num-wrap{position:relative}
    .bar-title{display:flex;align-items:center;gap:8px}
    .rate-dots{display:flex;gap:4px}
    .rate-dot{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);background:rgba(0,0,0,.25)}
    .rate-dot.is-on{background:var(--rate-b);box-shadow:0 0 5px var(--rate-glow)}
    .xp-gain{position:absolute;right:100%;top:50%;margin:-13px 8px 0 0;white-space:nowrap;padding:5px 8px;border-radius:8px;background:rgba(5,7,11,.7);color:var(--accent-b);font-size:13px;font-weight:800}
    .xp-gain:not([hidden]){animation:xp-arrive 450ms ease-out}
    @keyframes xp-arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.hero-video{transition:none}.app[data-mood="strong"] .hero-glow{animation:none}.hp-fill{transition:none}.xp-gain:not([hidden]){animation:none}.progress-fill{transition:none;animation:none}.progress-fill::after{animation:none;display:none}.progress-wordmark,.progress-wordmark .word-shimmer{animation:none}.progress-wordmark .word-shimmer{display:none}}

    /* The card flips on a tap, like the boss card. The back is Goku's side of the
       game: only what's already happened (forms reached, days logged, records).
       Nothing on it previews a form, level or stage still to come. */
    :root{--flip-ms:1100ms;--scouter:#7dffb0;--scouter-dim:rgba(125,255,176,.55);--gold:#ffd65c}
    .stage{position:fixed;inset:0;perspective:1800px;background:var(--bg)}
    /* Symmetric easing keeps the edge-on moment at exactly half the duration,
       which is when the faces swap visibility (Safari can ignore
       backface-visibility on <video>). */
    .flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--flip-ms) cubic-bezier(.45,0,.55,1)}
    .flipper.is-flipped{transform:rotateY(180deg)}
    .app,.hero-back{-webkit-backface-visibility:hidden;backface-visibility:hidden}
    .flipper.show-back .app,.flipper:not(.show-back) .hero-back{visibility:hidden}
    .hero-back{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;padding:calc(14px + var(--safe-top)) calc(14px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(14px + var(--safe-left));background:radial-gradient(120% 70% at 50% 0%,rgba(255,159,28,.16),transparent 60%),linear-gradient(180deg,#111624,#080b12);overflow:hidden}
    .hb-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;cursor:pointer}
    .hb-title{font-size:clamp(18px,5.6vw,24px);font-weight:850;letter-spacing:-.02em;line-height:1.1}
    .hb-sub{margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)}
    .hb-level{text-align:right}
    .hb-level .value{font-size:clamp(20px,6vw,26px)}
    .hero-back .label{text-shadow:none}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px;padding:3px;border-radius:11px;background:rgba(255,255,255,.06)}
    .tab{border:0;margin:0;padding:7px 0;border-radius:8px;background:transparent;color:rgba(255,255,255,.5);font:inherit;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
    .tab[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
    .panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 0}
    .panel[hidden]{display:none}
    .hint{flex:0 0 auto;padding-top:6px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.4);cursor:pointer}
    .empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
    /* Scouter: one reading per flip, drawn at random from what you've done. */
    .scouter{position:relative;overflow:hidden;padding:18px 16px 16px;border-radius:16px;border:1px solid rgba(125,255,176,.28);background:radial-gradient(120% 90% at 85% 10%,rgba(125,255,176,.18),transparent 55%),rgba(10,30,20,.55);box-shadow:inset 0 0 24px rgba(125,255,176,.08)}
    .scouter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(125,255,176,.05) 0 1px,transparent 1px 4px);pointer-events:none}
    .scouter .label{color:var(--scouter-dim)}
    .reading{position:relative;margin-top:8px;min-height:2.6em;font-size:clamp(17px,5vw,21px);font-weight:800;line-height:1.3;color:var(--scouter);text-shadow:0 0 10px rgba(125,255,176,.35)}
    .reading.typing::after{content:"▌";margin-left:2px;animation:blink .8s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .scouter.rare{border-color:rgba(255,214,92,.55);background:radial-gradient(120% 90% at 85% 10%,rgba(255,214,92,.25),transparent 55%),rgba(40,28,6,.6);box-shadow:inset 0 0 28px rgba(255,214,92,.15),0 0 22px rgba(255,214,92,.18)}
    .scouter.rare .label{color:rgba(255,214,92,.8)}
    .scouter.rare .reading{color:var(--gold);text-shadow:0 0 12px rgba(255,214,92,.45)}
    .records{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
    .record{padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
    .record-num{font-size:20px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
    .record .label{margin-top:3px;display:block}
    /* Forms: only the ones already reached, newest first. Tap one to replay it. */
    .forms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .form{position:relative;overflow:hidden;aspect-ratio:3/4;border-radius:14px;background:#0b0f17 center/cover no-repeat;border:1px solid rgba(255,255,255,.09);cursor:pointer}
    .form video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s linear}
    .form video.ready{opacity:1}
    .form-cap{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85))}
    .form-name{font-size:13px;font-weight:850;line-height:1.15}
    .form-meta{margin-top:2px;font-size:10px;font-weight:700;color:var(--muted)}
    .form-now{position:absolute;top:8px;left:8px;padding:3px 7px;border-radius:999px;background:rgba(255,159,28,.9);color:#111;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    /* Log: the last 14 journal days. */
    .days{list-style:none;margin:0;padding:0}
    .day{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
    .day-date{font-size:12px;font-weight:800;color:var(--muted)}
    .day-what{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;font-weight:700}
    .pill{padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:800;white-space:nowrap}
    .pill.moved{background:rgba(125,255,176,.14);color:var(--scouter)}
    .pill.rest{color:rgba(255,255,255,.45)}
    .pill.up{background:rgba(255,214,92,.16);color:var(--gold)}
    .pill.hp{background:rgba(125,255,176,.1);color:var(--scouter)}
    .day-xp{font-size:13px;font-weight:850;color:var(--accent-b);font-variant-numeric:tabular-nums;white-space:nowrap}
    .day-xp.pending{color:rgba(255,255,255,.35);font-weight:700;font-size:11px}
    @media(prefers-reduced-motion:reduce){.flipper{transition:none}.reading.typing::after{animation:none}}
  </style>
</head>
<body>
  <div class="stage">
  <div class="flipper" id="flipper">
  <main class="app" id="app" role="button" tabindex="0" aria-label="Goku. Tap to flip the card." data-tier="1" data-rarity="common" data-mood="steady">
    <video id="heroVideoA" class="hero-video is-active" autoplay muted playsinline preload="auto"></video>
    <video id="heroVideoB" class="hero-video" muted playsinline preload="auto"></video>
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-shade" aria-hidden="true"></div>

    <div class="hud-top">
      <div class="motivation-line" aria-hidden="true">
        <span class="motivation-emoji" id="motivationEmoji">🔥</span>
        <svg class="progress-wordmark" viewBox="0 0 280 28" preserveAspectRatio="xMinYMid meet" role="presentation">
          <defs>
            <linearGradient id="wordGradient" x1="0" y1="0" x2="1" y2="0">
              <stop class="word-stop-a" offset="0%" />
              <stop class="word-stop-b" offset="48%" />
              <stop class="word-stop-c" offset="100%" />
            </linearGradient>
            <linearGradient id="shimmerGradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(255,255,255,0)" />
              <stop offset="42%" stop-color="rgba(255,255,255,0)" />
              <stop offset="50%" stop-color="rgba(255,255,255,1)" />
              <stop offset="58%" stop-color="rgba(255,255,255,0)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            </linearGradient>
            <clipPath id="wordClip"><text id="motivationClipText" x="0" y="20">KEEP GOING</text></clipPath>
          </defs>
          <text id="motivationText" x="0" y="20">KEEP GOING</text>
          <rect class="word-shimmer" x="-280" y="0" width="280" height="28" clip-path="url(#wordClip)" />
        </svg>
      </div>
      <span class="sr-only" id="progressLabel">Keep going</span>
      <div class="metric right"><div class="label">Level</div><div class="value" id="level">—</div></div>
    </div>

    <div class="hud-bottom">
      <div class="bar-row hp-row" id="hpHud" hidden>
        <div class="bar-head"><span class="label">HP</span><span class="bar-num" id="hpNum">—</span></div>
        <div class="hp-track" id="hpTrack" role="progressbar" aria-label="Hero HP" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="hp-fill" id="hpFill"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-head"><span class="bar-title"><span class="label">XP</span><span class="rate-dots" id="rateDots" role="img" aria-label="Movement days"><span class="rate-dot"></span><span class="rate-dot"></span><span class="rate-dot"></span></span></span><span class="xp-num-wrap"><span class="bar-num" id="xpNum">—</span><span class="xp-gain" id="xpGain" role="status" aria-live="polite" hidden></span></span></div>
        <div class="progress-track" id="levelProgress" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
  </main>
  <section class="hero-back" id="heroBack" aria-hidden="true">
    <div class="hb-head" id="hbHead">
      <div><div class="label">Hero</div><div class="hb-title" id="hbForm">Goku</div><div class="hb-sub" id="hbSub"></div></div>
      <div class="hb-level"><div class="label">Level</div><div class="value" id="hbLevel">—</div></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" id="tabScouter" aria-controls="panelScouter" aria-selected="true">Scouter</button>
      <button class="tab" type="button" role="tab" id="tabForms" aria-controls="panelForms" aria-selected="false">Forms</button>
      <button class="tab" type="button" role="tab" id="tabLog" aria-controls="panelLog" aria-selected="false">Log</button>
    </div>
    <div class="panel" id="panelScouter" role="tabpanel" aria-labelledby="tabScouter">
      <div class="scouter" id="scouter"><div class="label" id="scouterLabel">Scouter reading</div><div class="reading" id="reading" aria-live="polite"></div></div>
      <div class="records" id="records"></div>
    </div>
    <div class="panel" id="panelForms" role="tabpanel" aria-labelledby="tabForms" hidden><div class="forms" id="forms"></div></div>
    <div class="panel" id="panelLog" role="tabpanel" aria-labelledby="tabLog" hidden><ul class="days" id="days"></ul></div>
    <div class="hint" id="hbHint">Tap here to flip back</div>
  </section>
  </div>
  </div>

  <script>
    // Same-origin (GitHub Pages) rather than raw.githubusercontent: Pages purges
    // its CDN on deploy, raw does not. Measured 58s vs >200s to reflect an update.
    const STATE_URL = 'data.json';
    // Hero HP lives with the boss battle in the Quest Engine Worker
    // (~/code/quest-engine), which updates it the moment a habit hits or heals.
    const BOSS_URL = 'https://quest-engine.quest-engine.workers.dev/boss';
    const REFRESH_MS = 15000;
    const CROSSFADE_MS = 1200;
    const CROSSFADE_LEAD_MS = 60;
    const MOTIVATION_HISTORY_KEY = 'mainQuest.motivationHistory.v2';
    const MOTIVATION_HISTORY_LIMIT = 12;

    const MOTIVATION = {
      1: [

    let currentMotivationTier = null;

    function performanceTier(state) {
      const tier = Number(state.performance_tier);
      if (Number.isInteger(tier) && tier >= 1 && tier <= 4) return tier;
      const rate = Number(state.performance_rate);
      if (!Number.isFinite(rate)) return 1;
      return rate >= 99.5 ? 4 : rate >= 66 ? 3 : rate >= 33 ? 2 : 1;
    }

    function readMotivationHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(MOTIVATION_HISTORY_KEY) || '[]');
        return Array.isArray(parsed) ? parsed.filter(item => typeof item === 'string').slice(-MOTIVATION_HISTORY_LIMIT) : [];
      } catch (_) { return []; }
    }

    function weightedPick(items) {
      const total = items.reduce((sum, item) => sum + Math.max(1, Number(item.weight) || 1), 0);
      let roll = Math.random() * total;
      for (const item of items) {
        roll -= Math.max(1, Number(item.weight) || 1);
        if (roll <= 0) return item;
      }
      return items[items.length - 1];
    }

    function chooseMotivation(tier) {
      const pool = MOTIVATION[tier] || MOTIVATION[1];
      const history = readMotivationHistory();
      const unseen = pool.filter(item => !history.includes(item.text));
      const candidates = unseen.length ? unseen : pool;
      const picked = weightedPick(candidates);
      const nextHistory = [...history, picked.text].slice(-MOTIVATION_HISTORY_LIMIT);
      try { localStorage.setItem(MOTIVATION_HISTORY_KEY, JSON.stringify(nextHistory)); } catch (_) {}
      return picked;
    }

    function motivationFontSize(text) {
      const length = text.length;
      if (length <= 16) return 15.4;
      if (length <= 23) return 14.2;
      if (length <= 31) return 12.9;
      if (length <= 39) return 11.7;
      return 10.6;
    }

    function splitMotivation(text) {
      const firstSpace = text.indexOf(' ');
      if (firstSpace <= 0) return { emoji:'✨', phrase:text };
      return { emoji:text.slice(0, firstSpace), phrase:text.slice(firstSpace + 1) };
    }

    function setMotivation(tier) {
      if (tier === currentMotivationTier) return;
      const message = chooseMotivation(tier);
      currentMotivationTier = tier;
      const parts = splitMotivation(message.text);
      const size = motivationFontSize(parts.phrase);
      motivationEmojiEl.textContent = parts.emoji;
      motivationTextEl.textContent = parts.phrase;
      motivationClipTextEl.textContent = parts.phrase;
      motivationTextEl.style.fontSize = size + 'px';
      motivationClipTextEl.style.fontSize = size + 'px';
      progressLabelEl.textContent = message.text;
      progressHudEl.dataset.rarity = message.rarity || 'common';
    }

    const VIDEO_FRAMING = {

    let lastSeenXp = null;

      if (saved !== null && Number.isFinite(Number(saved))) lastSeenXp = Number(saved);

    function renderState(state) {
      const wholeLevel = Math.trunc(Number(state.level ?? state.display_level));
      levelEl.textContent = Number.isFinite(wholeLevel) && wholeLevel > 0 ? wholeLevel : '—';

      const currentXp = state.xp == null ? NaN : Number(state.xp);
      if (Number.isFinite(currentXp)) {
        const gain = lastSeenXp === null ? 0 : currentXp - lastSeenXp;
        if (gain > 0) {
          const toast = document.getElementById('xpGain');
          toast.textContent = '+' + gain.toLocaleString() + ' XP';
          toast.hidden = false;
          clearTimeout(gainTimer);
          gainTimer = setTimeout(() => { toast.hidden = true; }, 4000);
        }
        lastSeenXp = currentXp;
        try { localStorage.setItem(XP_STORAGE_KEY, String(currentXp)); } catch (_) {}
      }

      const curHp = Number(state.current_hp);
      const maxHp = Number(state.max_hp);
      let hpPct = NaN;
      if (Number.isFinite(curHp) && Number.isFinite(maxHp) && maxHp > 0) {
        hpPct = Math.max(0, Math.min(100, (curHp / maxHp) * 100));
        hpFillEl.style.width = hpPct + '%';
        hpNumEl.textContent = Math.round(curHp).toLocaleString() + ' / ' + Math.round(maxHp).toLocaleString();
        hpTrackEl.setAttribute('aria-valuenow', String(Math.round(hpPct)));
        hpHudEl.dataset.low = hpPct <= 30 ? '1' : '0';
        hpHudEl.hidden = false;
      } else {
        hpHudEl.hidden = true;
      }

      // Fill from XP within the level when available so the bar matches the readout;
      // level_progress (stage-weighted) is only the fallback.
      const levelXp = state.level_xp == null ? NaN : Number(state.level_xp);
      const levelXpMax = state.level_xp_max == null ? NaN : Number(state.level_xp_max);
      const hasLevelXp = Number.isFinite(levelXp) && Number.isFinite(levelXpMax) && levelXpMax > 0;
      const rawProgress = hasLevelXp ? (levelXp / levelXpMax) * 100 : Number(state.level_progress ?? state.progress ?? 0);
      const progress = Number.isFinite(rawProgress) ? Math.max(0, Math.min(100, rawProgress)) : 0;
      progressFillEl.style.width = progress + '%';
      progressTrackEl.setAttribute('aria-valuenow', String(Math.round(progress)));
      xpNumEl.textContent = hasLevelXp
        ? Math.round(levelXp).toLocaleString() + ' / ' + Math.round(levelXpMax).toLocaleString()
        : Math.round(progress) + '%';

      // Movement days in the last 3 journal entries; falls back to the 3-day average.
      const doneRaw = state.completed_count == null ? NaN : Number(state.completed_count);
      const usedRaw = state.entries_used == null ? NaN : Number(state.entries_used);
      const rate = Number(state.performance_rate);
      const done = Math.max(0, Math.min(3, Number.isFinite(doneRaw) ? doneRaw : Number.isFinite(rate) ? Math.round(rate / 100 * 3) : 0));
      const used = Number.isFinite(usedRaw) && usedRaw > 0 ? Math.min(3, usedRaw) : 3;
      Array.from(rateDotsEl.children).forEach((dot, i) => dot.classList.toggle('is-on', i < done));
      rateDotsEl.setAttribute('aria-label', 'Movement on ' + done + ' of the last ' + used + ' days');

      const tier = performanceTier(state);
      progressHudEl.dataset.tier = String(tier);
      progressHudEl.dataset.mood = PREVIEW_MOOD || heroMood(tier, hpPct);
      setMotivation(tier);

    // ?mood=strong|steady|slipping previews a mood instead of the live one.
    const PREVIEW_MOOD = ['strong', 'steady', 'slipping'].find(m => m === new URLSearchParams(location.search).get('mood')) || '';

    // Strong = 3/3 Movement days with HP above the low mark; slipping = 1/3 or fewer
    // Movement days, or low HP (same 30% mark as the red HP bar); otherwise steady.
    function heroMood(tier, hpPct) {
      if (tier <= 2 || (Number.isFinite(hpPct) && hpPct <= 30)) return 'slipping';
      return tier === 4 ? 'strong' : 'steady';

    function resetCrossfadeState() {
      crossfadeRunning = false;
      clearTimeout(crossfadeTimer);
      crossfadeTimer = null;
      activeVideoIndex = 0;
      videos.forEach((video, index) => {
        video.pause();
        try { video.currentTime = 0; } catch (_) {}
        video.classList.toggle('is-active', index === 0);
        video.style.zIndex = '0';
      });
    }

    function loadVideoPair(videoUrl, scale) {
      resetCrossfadeState();
      videos.forEach(video => {
        video.style.setProperty('--video-scale', String(scale));
        video.removeAttribute('src');
        video.load();
        video.src = videoUrl;
        video.load();
      });
      const first = videos[0];
      const startPlayback = () => first.play().catch(() => {});
      if (first.readyState >= 2) startPlayback();
      else first.addEventListener('canplay', startPlayback, { once: true });
    }

    function startCrossfade() {
      if (crossfadeRunning) return;
      const outgoing = videos[activeVideoIndex];
      const incomingIndex = 1 - activeVideoIndex;
      const incoming = videos[incomingIndex];
      if (!Number.isFinite(outgoing.duration) || outgoing.duration <= 0) return;

      crossfadeRunning = true;
      incoming.pause();
      try { incoming.currentTime = 0; } catch (_) {}
      incoming.classList.remove('is-active');
      outgoing.classList.add('is-active');
      outgoing.style.zIndex = '0';
      incoming.style.zIndex = '1';

      const beginFade = () => {
        incoming.play().then(() => {
          requestAnimationFrame(() => {
            incoming.classList.add('is-active');
          });
          crossfadeTimer = setTimeout(() => {
            outgoing.classList.remove('is-active');
            outgoing.pause();
            try { outgoing.currentTime = 0; } catch (_) {}
            incoming.style.zIndex = '0';
            outgoing.style.zIndex = '0';
            activeVideoIndex = incomingIndex;
            crossfadeRunning = false;
            crossfadeTimer = null;
          }, CROSSFADE_MS + 40);
        }).catch(() => {
          incoming.style.zIndex = '0';
          crossfadeRunning = false;
        });
      };

      if (incoming.readyState >= 2) beginFade();
      else incoming.addEventListener('canplay', beginFade, { once: true });
    }

    function monitorVideoLoop() {
      const active = videos[activeVideoIndex];
      if (!crossfadeRunning && active.readyState >= 2 && Number.isFinite(active.duration) && active.duration > 0) {
        const remainingMs = (active.duration - active.currentTime) * 1000;
        if (active.currentTime > 0 && remainingMs <= CROSSFADE_MS + CROSSFADE_LEAD_MS) startCrossfade();
      }
      requestAnimationFrame(monitorVideoLoop);
    }

        const scale = VIDEO_FRAMING[framingId] || 1;

    const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const fmtDay = (key, withWeekday) => {
      const t = dayMs(key);
      if (isNaN(t)) return '';
      const d = new Date(t);
      return (withWeekday ? WEEKDAYS[d.getUTCDay()] + ' ' : '') + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()];
    };
    const todayKey = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Amsterdam', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    const questDay = () => hero && hero.started ? Math.round((dayMs(todayKey()) - dayMs(hero.started)) / 86400000) + 1 : null;
    const still = f => f.video_public_id && f.video_version ? CLOUD + 'so_1.5,w_360,h_480,c_fill,g_north/v' + f.video_version + '/' + f.video_public_id + '.jpg' : '';
    // Same crop and start frame as the still, so the clip takes over without a jump.
    const clip = f => f.video_public_id && f.video_version ? CLOUD + 'ac_none,so_1.5,w_540,h_720,c_fill,g_north/v' + f.video_version + '/' + f.video_public_id + '.mp4' : '';
    const pick = list => list[Math.floor(Math.random() * list.length)];
    const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    // hero.json is built at 04:40, so today's heals come live from the boss card's
    // log (BOSS_URL above), summed per game day (04:00 Amsterdam rollover).
    const gameDay = ms => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Amsterdam', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms - 4 * 3600000));
    let liveHeal = { day: '', hp: 0 };

    async function loadLiveHeal() {
      try {
        const response = await fetch(`${BOSS_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) return;
        const boss = await response.json();
        const day = gameDay(Date.now());
        const hp = (Array.isArray(boss.log) ? boss.log : []).reduce((sum, e) => {
          const at = Date.parse(e && e.at);
          return sum + (!isNaN(at) && gameDay(at) === day ? Math.max(0, Number(e.heal) || 0) : 0);
        }, 0);
        liveHeal = { day: day, hp: hp };
      } catch (error) { /* the boss card is optional here */ }
    }

        [r.longest_run, 'Longest run']

    let formsKey = '';
    function renderForms(forms) {
      const el = document.getElementById('forms');
      const key = JSON.stringify(forms);
      if (key === formsKey && el.children.length) return;
      formsKey = key;
      if (!forms.length) { el.innerHTML = '<div class="empty">Your forms appear here after tonight’s run.</div>'; return; }
      el.innerHTML = forms.slice().reverse().map((f, i) => `
        <div class="form" data-level="${esc(f.level)}" style="background-image:url('${esc(still(f))}')" role="button" tabindex="0" aria-label="${esc(f.form)}, reached ${esc(fmtDay(f.reached))}. Tap to replay.">

    function toggleFormClip(tile) {
      const f = (hero.forms || []).find(x => String(x.level) === tile.dataset.level);
      const playing = tile.querySelector('video');
      document.querySelectorAll('.form video').forEach(v => v.remove());
      if (playing || !f || !clip(f)) return;
      const video = document.createElement('video');
      Object.assign(video, { src: clip(f), muted: true, loop: true, playsInline: true, autoplay: true });
      video.setAttribute('playsinline', '');
      // Stay invisible over the still until frames are actually showing: no black flash.
      video.addEventListener('playing', () => video.classList.add('ready'), { once: true });
      tile.insertBefore(video, tile.firstChild);
      video.play().catch(() => {});
    }

    function renderDays() {

      const today = todayKey();
      el.innerHTML = days.map(d => {
        // Today's Movement is ticked later in the day, so no verdict on it yet.
        const pills = [d.movement ? '<span class="pill moved">Moved</span>' : d.date === today ? '<span class="pill">Today</span>' : '<span class="pill rest">No movement</span>'];
        if (d.workouts) pills.push(`<span class="pill">${d.workouts > 1 ? d.workouts + ' workouts' : '1 workout'}</span>`);
        if (d.level_up) pills.push(`<span class="pill up">Level ${esc(d.level)}</span>`);
        else if (d.stage_up) pills.push(`<span class="pill">Stage ${esc(d.stage)}</span>`);
        const healed = Math.max(Number(d.healed) || 0, d.date === liveHeal.day ? liveHeal.hp : 0);
        const hp = (Number(d.restored) || 0) + healed;
        if (hp > 0) {
          const why = [d.restored > 0 ? `${fmtNum(d.restored)} overnight` : '', healed > 0 ? `${fmtNum(healed)} from habits` : ''].filter(Boolean).join(' · ');
          pills.push(`<span class="pill hp" title="${esc(why)}">💚 +${fmtNum(hp)} HP</span>`);
        }
        const xp = d.gain == null ? '<span class="day-xp pending">counts at 04:00</span>' : `<span class="day-xp">+${fmtNum(d.gain)} XP</span>`;
        return `<li class="day"><span class="day-date">${esc(fmtDay(d.date, true))}</span><span class="day-what">${pills.join('')}</span>${xp}</li>`;
      }).join('');
    }

    // One reading per flip, never one of the last few. Now and then a rare one.
    function readings() {
      const r = (hero && hero.records) || {};
      const forms = (hero && hero.forms) || [];
      const days = (hero && hero.days) || [];
      const common = [], rare = [];
      const xp = Number(r.xp || 0);
      if (xp) common.push(xp > 9000 ? `Power reading: ${fmtNum(xp)} XP. It's over 9000!` : `Power reading: ${fmtNum(xp)} XP.`);
      if (r.current_run > 1) common.push(`${r.current_run} days in a row with movement.`);
      if (r.best_gain) common.push(`Biggest day so far: ${fmtDay(r.best_gain.date)}, +${fmtNum(r.best_gain.gain)} XP.`);
      if (r.movement_days) common.push(`${r.movement_days} days with movement since ${fmtDay(hero.started)}.`);
      if (r.workouts) common.push(`${r.workouts} workouts logged on the quest.`);
      if (r.longest_run > 2) common.push(`Longest run: ${r.longest_run} days of movement without a break.`);
      if (r.fastest_level) common.push(`Fastest transformation: ${r.fastest_level.form} in ${r.fastest_level.days} days.`);
      if (r.stage) common.push(`Stage ${r.stage} of the Main Quest, cleared by showing up.`);
      const day = questDay();
      if (day) common.push(`Day ${day} of the quest. Still standing.`);
      const earned = days.find(d => d.gain != null);
      if (earned && earned.gain) common.push(`${fmtDay(earned.date, true)} earned you +${fmtNum(earned.gain)} XP.`);
      for (const f of forms.slice(0, -1)) if (f.reached) common.push(`Flashback: on ${fmtDay(f.reached)} you became ${f.form}.`);
      if (forms.length > 1 && forms[0].reached) rare.push(`Memory unlocked: ${fmtDay(forms[0].reached)}, the day it all started as ${forms[0].form}. Look at you now.`);
      rare.push('Reading unstable… the scouter just cracked.', 'The only one you need to beat is the you from yesterday.', 'Power comes in response to a need, not a desire.', 'A Saiyan never stops at their limit.', 'Somewhere, Vegeta just clenched his fist.');
      return { common: common, rare: rare };
    }

    function nextReading() {
      const pool = readings();
      if (!pool.common.length) return { text: 'Scouter calibrating… come back after tonight’s run.', rare: false };
      let history = [];
      try { history = JSON.parse(localStorage.getItem(READING_HISTORY_KEY) || '[]'); } catch (_) {}
      if (!Array.isArray(history)) history = [];
      const isRare = Math.random() < RARE_CHANCE;
      const list = isRare ? pool.rare : pool.common;
      const fresh = list.filter(t => !history.includes(t));
      const text = pick(fresh.length ? fresh : list);
      try { localStorage.setItem(READING_HISTORY_KEY, JSON.stringify([...history, text].slice(-6))); } catch (_) {}
      return { text: text, rare: isRare };
    }

    function showReading() {
      const reading = nextReading();
      scouterEl.classList.toggle('rare', reading.rare);
      document.getElementById('scouterLabel').textContent = reading.rare ? '⚡ Rare reading' : 'Scouter reading';
      clearInterval(typeTimer);
      if (reduceMotion) { readingEl.textContent = reading.text; return; }
      // Typed out like a scouter readout.
      let i = 0;
      readingEl.textContent = '';
      readingEl.classList.add('typing');
      typeTimer = setInterval(() => {
        i += 1;
        readingEl.textContent = reading.text.slice(0, i);
        if (i >= reading.text.length) { clearInterval(typeTimer); readingEl.classList.remove('typing'); }
      }, 28);
    }

    function selectTab(id) {
      document.querySelectorAll('.tab').forEach(tab => {
        const on = tab.id === id;
        tab.setAttribute('aria-selected', String(on));
        document.getElementById(tab.getAttribute('aria-controls')).hidden = !on;
      });
      if (id !== 'tabForms') document.querySelectorAll('.form video').forEach(v => v.remove());
    }

    function setFlipped(flipped) {
      const flipMs = reduceMotion ? 0 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--flip-ms')) || 1100;
      flipperEl.classList.toggle('is-flipped', flipped);
      progressHudEl.setAttribute('aria-hidden', String(flipped));
      backEl.setAttribute('aria-hidden', String(!flipped));
      clearTimeout(flipTimer);
      flipTimer = setTimeout(() => flipperEl.classList.toggle('show-back', flipped), flipMs / 2);
      if (flipped) {
        renderBack();
        showReading();
        loadHero();
        document.querySelectorAll('.panel').forEach(p => { p.scrollTop = 0; });
        setTimeout(() => videos.forEach(v => v.pause()), flipMs);
      } else {
        document.querySelectorAll('.form video').forEach(v => v.remove());
        videos[activeVideoIndex].play().catch(() => {});
      }
    }

    progressHudEl.addEventListener('click', () => setFlipped(true));
    progressHudEl.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); setFlipped(true); }
    });
    backEl.addEventListener('click', event => {
      const tab = event.target.closest('.tab');
      if (tab) { selectTab(tab.id); return; }
      const tile = event.target.closest('.form');
      if (tile) { toggleFormClip(tile); return; }
      if (event.target.closest('#hbHead, #hbHint')) setFlipped(false);
    });
    backEl.addEventListener('keydown', event => {
      const tile = event.target.closest('.form');
      if (tile && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); toggleFormClip(tile); }
      if (event.key === 'Escape') setFlipped(false);
    });
    // Browsers pause muted video in a hidden tab; pick the front back up.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !flipperEl.classList.contains('is-flipped')) videos[activeVideoIndex].play().catch(() => {});
    });

    monitorVideoLoop();
    loadHero();
    refreshDashboard();
    setInterval(refreshDashboard, REFRESH_MS);
  </script>
</body>
</html>
