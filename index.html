<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Main Quest</title>

  <style>
    :root {
      --text: #fff;
      --muted: rgba(255,255,255,0.72);
      --accent1: #ff9f1c;
      --accent2: #ffd54a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      overflow: hidden;
      background: #05070b;
    }

    .video-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #05070b;
    }

    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 50%;
      display: block;
      opacity: 0;
      transition: opacity 450ms linear;
      background: #05070b;
    }

    .hero.active {
      opacity: 1;
      z-index: 1;
    }

    .hero.standby {
      opacity: 0;
      z-index: 0;
    }

    .hud-top {
      position: absolute;
      top: calc(10px + var(--safe-top));
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 3;
      pointer-events: none;
    }

    .metric {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 2px 4px;
    }

    .metric-left { text-align: left; }
    .metric-right { text-align: right; }

    .label {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-shadow: 0 1px 4px rgba(0,0,0,0.75);
    }

    .value {
      font-size: clamp(20px, 6vw, 28px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.035em;
      color: #fff;
      text-shadow: 0 1px 5px rgba(0,0,0,0.82);
    }

    .hud-bottom {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: calc(10px + var(--safe-bottom));
      z-index: 3;
      pointer-events: none;
    }

    .progress {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 2px 0;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .progress-percent {
      font-size: 9px;
      font-weight: 750;
      color: rgba(255,255,255,0.78);
      text-shadow: 0 1px 4px rgba(0,0,0,0.75);
    }

    .bar {
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.18);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }

    .fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      box-shadow: 0 0 8px rgba(255,196,54,0.24);
      transition: width 350ms ease;
    }
  </style>
</head>

<body>
  <main class="screen">
    <div class="video-stage">
      <video
        id="videoA"
        class="hero active"
        autoplay
        muted
        playsinline
        preload="auto"
        poster="https://res.cloudinary.com/a3xk0plk/image/upload/v1788696083/8177ba3e-8184-4b5f-ac9c-e0ebbc0b2d2b.png"
      ></video>

      <video
        id="videoB"
        class="hero standby"
        autoplay
        muted
        playsinline
        preload="auto"
        poster="https://res.cloudinary.com/a3xk0plk/image/upload/v1788696083/8177ba3e-8184-4b5f-ac9c-e0ebbc0b2d2b.png"
      ></video>
    </div>

    <section class="hud-top">
      <article class="metric metric-left">
        <div class="label">XP</div>
        <div class="value" id="xp">12</div>
      </article>

      <article class="metric metric-right">
        <div class="label">Level</div>
        <div class="value" id="level">1</div>
      </article>
    </section>

    <section class="hud-bottom">
      <article class="progress" id="progressCard" aria-label="Progress 10 percent">
        <div class="progress-head">
          <div class="label">Progress</div>
          <div class="progress-percent" id="progressPercent">10%</div>
        </div>
        <div class="bar">
          <div class="fill" id="progressFill"></div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const STATE_URL = "https://res.cloudinary.com/a3xk0plk/raw/upload/MainQuest/data.json";
    const FALLBACK_POSTER = "https://res.cloudinary.com/a3xk0plk/image/upload/v1788696083/8177ba3e-8184-4b5f-ac9c-e0ebbc0b2d2b.png";
    const FALLBACK_VIDEO = "https://res.cloudinary.com/a3xk0plk/video/upload/v1788698711/Quest-Progress/3d124147-f877-81d1-a87b-fe82ea613420.mp4";

    const videoA = document.getElementById("videoA");
    const videoB = document.getElementById("videoB");

    let activeVideo = videoA;
    let standbyVideo = videoB;
    let currentVideoUrl = FALLBACK_VIDEO;
    let currentPosterUrl = FALLBACK_POSTER;

    const FADE_MS = 450;
    const LOOP_CHECK_MS = 80;
    let isCrossfading = false;
    let loopWatcher = null;

    function applyVideoSource(video, src, poster) {
      if (video.dataset.src !== src) {
        video.src = src;
        video.dataset.src = src;
      }
      video.poster = poster || FALLBACK_POSTER;
      video.load();
    }

    async function safePlay(video) {
      try {
        await video.play();
      } catch (e) {
        console.error("Video play failed", e);
      }
    }

    function swapVideos() {
      const oldActive = activeVideo;
      activeVideo = standbyVideo;
      standbyVideo = oldActive;

      activeVideo.classList.remove("standby");
      activeVideo.classList.add("active");

      standbyVideo.classList.remove("active");
      standbyVideo.classList.add("standby");
    }

    async function crossfadeLoop() {
      if (isCrossfading) return;
      isCrossfading = true;

      standbyVideo.currentTime = 0;
      await safePlay(standbyVideo);

      standbyVideo.classList.remove("standby");
      standbyVideo.classList.add("active");

      activeVideo.classList.remove("active");
      activeVideo.classList.add("standby");

      setTimeout(() => {
        activeVideo.pause();
        swapVideos();
        isCrossfading = false;
      }, FADE_MS);
    }

    function startLoopWatcher() {
      if (loopWatcher) clearInterval(loopWatcher);

      loopWatcher = setInterval(() => {
        if (!activeVideo || !activeVideo.duration || isCrossfading) return;

        const remaining = activeVideo.duration - activeVideo.currentTime;
        if (remaining <= FADE_MS / 1000) {
          crossfadeLoop();
        }
      }, LOOP_CHECK_MS);
    }

    async function initVideos(src, poster) {
      currentVideoUrl = src || FALLBACK_VIDEO;
      currentPosterUrl = poster || FALLBACK_POSTER;

      applyVideoSource(videoA, currentVideoUrl, currentPosterUrl);
      applyVideoSource(videoB, currentVideoUrl, currentPosterUrl);

      videoA.currentTime = 0;
      videoB.currentTime = 0;

      activeVideo = videoA;
      standbyVideo = videoB;

      videoA.classList.add("active");
      videoA.classList.remove("standby");

      videoB.classList.add("standby");
      videoB.classList.remove("active");

      await safePlay(videoA);
      startLoopWatcher();
    }

    function updateMetrics(data) {
      document.getElementById("level").textContent = data.level ?? "-";
      document.getElementById("xp").textContent = data.xp ?? "-";

      const progress = Number(data.progress ?? 0);
      const clamped = Math.max(0, Math.min(100, progress));

      document.getElementById("progressPercent").textContent = `${clamped}%`;
      document.getElementById("progressFill").style.width = `${clamped}%`;
      document.getElementById("progressCard").setAttribute("aria-label", `Progress ${clamped} percent`);
    }

    async function loadState() {
      try {
        const response = await fetch(`${STATE_URL}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`State request failed: ${response.status}`);

        const data = await response.json();
        updateMetrics(data);

        const nextPoster = data.image_url || FALLBACK_POSTER;
        const nextVideo = data.video_url || FALLBACK_VIDEO;

        if (nextVideo !== currentVideoUrl || nextPoster !== currentPosterUrl) {
          await initVideos(nextVideo, nextPoster);
        }
      } catch (error) {
        console.error("Could not load Main Quest state", error);
      }
    }

    initVideos(FALLBACK_VIDEO, FALLBACK_POSTER).then(() => {
      loadState();
      setInterval(loadState, 60000);
    });
  </script>
</body>
</html>
