<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Main Quest</title>

  <style>
    :root {
      --bg: #05070b;
      --text: #fff;
      --muted: rgba(255,255,255,.72);
      --accent-a: #ff9f1c;
      --accent-b: #ffd54a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    .app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
    }

    #heroVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: var(--bg);
      display: block;
    }

    .hud-top {
      position: absolute;
      top: calc(12px + var(--safe-top));
      left: calc(12px + var(--safe-left));
      right: calc(12px + var(--safe-right));
      display: flex;
      justify-content: space-between;
      z-index: 2;
      pointer-events: none;
    }

    .metric.right { text-align: right; }

    .label {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      text-shadow: 0 1px 4px rgba(0,0,0,.85);
    }

    .value {
      margin-top: 3px;
      font-size: clamp(23px, 6.5vw, 31px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -.04em;
      text-shadow: 0 1px 6px rgba(0,0,0,.9);
    }

    .hud-bottom {
      position: absolute;
      left: calc(12px + var(--safe-left));
      right: calc(12px + var(--safe-right));
      bottom: calc(14px + var(--safe-bottom));
      z-index: 2;
      pointer-events: none;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .progress-value {
      font-size: 10px;
      font-weight: 800;
      color: rgba(255,255,255,.82);
      text-shadow: 0 1px 4px rgba(0,0,0,.85);
    }

    .progress-track {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
      transition: width 300ms ease;
    }
  </style>
</head>

<body>
  <main class="app">
    <video id="heroVideo" autoplay muted loop playsinline preload="auto"></video>

    <div class="hud-top">
      <div class="metric">
        <div class="label">XP</div>
        <div class="value" id="xp">—</div>
      </div>
      <div class="metric right">
        <div class="label">Level</div>
        <div class="value" id="level">—</div>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="progress-head">
        <div class="label">Progress</div>
        <div class="progress-value" id="progressText">0%</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </main>

  <script>
    const CLOUD_NAME = "a3xk0plk";
    const STATE_URL = `https://res.cloudinary.com/${CLOUD_NAME}/raw/upload/MainQuest/data.json`;
    const REFRESH_MS = 30000;
    const HARD_RELOAD_MS = 300000;

    const video = document.getElementById("heroVideo");
    const xpEl = document.getElementById("xp");
    const levelEl = document.getElementById("level");
    const progressTextEl = document.getElementById("progressText");
    const progressFillEl = document.getElementById("progressFill");

    let currentVideoKey = "";

    function decodeState(raw) {
      const text = raw.trim();
      const prefix = "data:application/json;base64,";

      if (text.startsWith(prefix)) {
        const binary = atob(text.slice(prefix.length));
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes));
      }

      return JSON.parse(text);
    }

    function updateMetrics(state) {
      xpEl.textContent = state.xp ?? "—";
      levelEl.textContent = state.level ?? "—";

      const value = Number(state.progress ?? 0);
      const progress = Number.isFinite(value) ? Math.max(0, Math.min(100, value)) : 0;
      progressTextEl.textContent = `${progress}%`;
      progressFillEl.style.width = `${progress}%`;
    }

    function buildVideoUrl(state) {
      if (state.video_public_id && state.video_version) {
        const publicId = String(state.video_public_id)
          .split("/")
          .map(encodeURIComponent)
          .join("/");
        return `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/v${state.video_version}/${publicId}.mp4`;
      }

      // Temporary backwards compatibility until data.json has been republished
      return state.video_url || "";
    }

    async function startVideo(url, key) {
      if (!url || key === currentVideoKey) return;

      currentVideoKey = key;
      video.pause();
      video.removeAttribute("src");
      video.load();

      video.muted = true;
      video.defaultMuted = true;
      video.autoplay = true;
      video.loop = true;
      video.playsInline = true;
      video.src = url;
      video.load();

      try {
        await video.play();
      } catch (error) {
        console.error("Video autoplay failed", error);
      }
    }

    async function loadState() {
      try {
        const response = await fetch(`${STATE_URL}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`State request failed: ${response.status}`);

        const raw = await response.text();
        const state = decodeState(raw);
        updateMetrics(state);

        const videoUrl = buildVideoUrl(state);
        const videoKey = state.video_public_id && state.video_version
          ? `${state.video_public_id}@${state.video_version}`
          : videoUrl;

        await startVideo(videoUrl, videoKey);
      } catch (error) {
        console.error("Could not load Main Quest state", error);
      }
    }

    video.addEventListener("canplay", () => {
      video.play().catch(() => {});
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && currentVideoKey) {
        video.play().catch(() => {});
      }
    });

    window.addEventListener("focus", () => {
      if (currentVideoKey) video.play().catch(() => {});
    });

    loadState();
    setInterval(loadState, REFRESH_MS);
    setInterval(() => location.reload(), HARD_RELOAD_MS);
  </script>
</body>
</html>
