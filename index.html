    function renderRecords() {
      const el = document.getElementById('records');
      const r = hero && hero.records;
      if (!r) { el.innerHTML = ''; return; }
      const cells = [
        [r.current_run, r.current_run === 1 ? 'Day of success' : 'Success days in a row', 'run'],
        [r.best_gain ? '+' + fmtNum(r.best_gain.gain) : '—', 'Best day' + (r.best_gain ? ' · ' + fmtDay(r.best_gain.date) : ''), 'best'],
        [r.movement_days, 'Success days', 'successDays'],
        [r.longest_run, 'Longest run', 'longest']
      ];
      el.innerHTML = cells.map(([n, label, info]) => `<div class="record" data-info="${info}"><div class="record-num">${esc(n)}</div><span class="label">${esc(label)}</span></div>`).join('');
    }

    let formsKey = '';
    function renderForms(forms) {
      const el = document.getElementById('forms');
      const key = JSON.stringify(forms);
      if (key === formsKey && el.children.length) return;
      formsKey = key;
      if (!forms.length) { el.innerHTML = '<div class="empty">Your forms appear here after tonight’s run.</div>'; return; }
      el.innerHTML = forms.slice().reverse().map((f, i) => `
        <div class="form" data-level="${esc(f.level)}" style="background-image:url('${esc(still(f))}')" role="button" tabindex="0" aria-label="${esc(f.form)}, reached ${esc(fmtDay(f.reached))}. Tap for its story.">
          ${i === 0 ? '<span class="form-now">Now</span>' : ''}
          <div class="form-cap"><div class="form-name">${esc(f.form)}</div><div class="form-meta">Level ${esc(f.level)}${f.reached ? ' · ' + esc(fmtDay(f.reached)) : ''}</div></div>
        </div>`).join('');
    }

    function toggleFormClip(tile) {
      const f = (hero.forms || []).find(x => String(x.level) === tile.dataset.level);
      const playing = tile.querySelector('video');
      document.querySelectorAll('.form video').forEach(v => v.remove());
      if (playing || !f || !clip(f)) return;
      const video = document.createElement('video');
      Object.assign(video, { src: clip(f), muted: true, loop: true, playsInline: true, autoplay: true });
      video.setAttribute('playsinline', '');
      // Stay invisible over the still until frames are actually showing: no black flash.
      video.addEventListener('playing', () => video.classList.add('ready'), { once: true });
      tile.insertBefore(video, tile.firstChild);
      video.play().catch(() => {});
    }

    function renderDays() {
      const el = document.getElementById('days');
      const days = (hero && Array.isArray(hero.days)) ? hero.days : [];
      if (!days.length) { el.innerHTML = '<li class="empty">Your days appear here after tonight’s run.</li>'; return; }
      const today = todayKey();
      el.innerHTML = days.map(d => {
        // Today's Success is ticked later in the day, so no verdict on it yet.
        const pills = [d.movement ? '<span class="pill moved">Success</span>' : d.date === today ? '<span class="pill">Today</span>' : '<span class="pill rest">No success</span>'];
        if (d.workouts) pills.push(`<span class="pill">${d.workouts > 1 ? d.workouts + ' workouts' : '1 workout'}</span>`);
        if (d.level_up) pills.push(`<span class="pill up">Level ${esc(d.level)}</span>`);
        else if (d.stage_up) pills.push(`<span class="pill">Stage ${esc(d.stage)}</span>`);
        const healed = Math.max(Number(d.healed) || 0, d.date === liveHeal.day ? liveHeal.hp : 0);
        const hp = (Number(d.restored) || 0) + healed;
        if (hp > 0) {
          const why = [d.restored > 0 ? `${fmtNum(d.restored)} overnight` : '', healed > 0 ? `${fmtNum(healed)} from habits` : ''].filter(Boolean).join(' · ');
          pills.push(`<span class="pill hp" title="${esc(why)}">💚 +${fmtNum(hp)} HP</span>`);
        }
        // Damage taken from bad habits that day.
        const hurt = Math.max(Number(d.damaged) || 0, d.date === liveHeal.day ? liveHeal.damage : 0);
        if (hurt > 0) pills.push(`<span class="pill dmg" title="Damage taken from bad habits">💢 −${fmtNum(hurt)} HP</span>`);
        const xp = d.gain == null ? '<span class="day-xp pending">counts at 04:00</span>' : `<span class="day-xp">+${fmtNum(d.gain)} XP</span>`;
        const open = openDays.has(d.date);
        return `<li class="day" data-date="${esc(d.date)}" role="button" tabindex="0" aria-expanded="${open}"><span class="day-date">${esc(fmtDay(d.date, true))}</span><span class="day-what">${pills.join('')}</span>${xp}${open ? dayDetails(d) : ''}</li>`;
      }).join('');
    }

    // ---- Log day details (Roy, 3 Oct 2026): tap a day to see what happened ----
    // hero.json carries each day's battle events (rebuilt every hour); today's
    // also come live from the boss card's log, so a tap shows up right away.
    const openDays = new Set();
    const evTime = at => { const t = Date.parse(at); return isNaN(t) ? '' : new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit' }).format(new Date(t)); };
    function dayEvents(d) {
      const byId = new Map();
      for (const e of Array.isArray(d.events) ? d.events : []) byId.set(String(e.id || Math.random()), e);
      if (d.date === liveHeal.day) for (const e of liveHeal.events) if (e && e.id && !byId.has(String(e.id))) byId.set(String(e.id), e);
      return [...byId.values()].sort((a, b) => (Date.parse(a.at) || 0) - (Date.parse(b.at) || 0));
    }
    function eventFx(e) {
      const dmg = Number(e.damage) || 0, heal = Number(e.heal) || 0, shield = Number(e.shield) || 0;
      if (e.kind === 'hero') {
        const fx = [];
        if (dmg > 0) fx.push(`<span class="ev-fx hurt">💢 −${fmtNum(dmg)} HP</span>`);
        if (shield > 0) fx.push(`<span class="ev-fx shield">🛡️ ${fmtNum(shield)} blocked</span>`);
        // A bad habit that did no damage was taken by the ki shield.
        return fx.join(' ') || '<span class="ev-fx shield">🛡️ blocked</span>';
      }
      if (e.wish) return '<span class="ev-fx">🐉 Wish</span>';
      const fx = [];
      if (dmg > 0) fx.push(`<span class="ev-fx">⚔️ ${fmtNum(dmg)}${e.crit ? ' crit' : ''}</span>`);
      if (heal > 0) fx.push(`<span class="ev-fx heal">💚 +${fmtNum(heal)} HP</span>`);
      // A heal habit after the day's heal cap is full gives nothing back.
      return fx.join(' ') || '<span class="ev-fx none">+0 HP · heal cap full</span>';
    }
    function dayDetails(d) {
      const list = dayEvents(d);
      const rows = [];
      if (Number(d.restored) > 0) rows.push(`<li><span class="ev-time">04:00</span><span>Overnight recovery</span><span class="ev-fx heal">💚 +${fmtNum(d.restored)} HP</span></li>`);
      for (const e of list) rows.push(`<li><span class="ev-time">${esc(evTime(e.at))}</span><span>${esc(e.habit || 'Hit')}</span>${eventFx(e)}</li>`);
      if (!rows.length) rows.push('<li><span class="ev-empty">Nothing logged this day.</span></li>');
      return `<ul class="day-more">${rows.join('')}</ul>`;
    }
    function toggleDay(li) {
      const date = li.dataset.date;
      if (openDays.has(date)) openDays.delete(date); else openDays.add(date);
      renderDays();
    }

    // ---- Lore: the current form's story on the Lore tab; any reached form's from its tile ----
    // The story is the form's Lore in D1 (goku.lore), carried in hero.json only
    // once the form is reached, so nothing here gives away what comes next.
    const loreFacts = f => [f.reached ? 'Reached ' + fmtDay(f.reached) : '', f.move || ''].filter(Boolean);
    const loreHtml = (f, now) => `
      <div class="lore-epithet">Chapter ${esc(f.level)}${now ? ' · Now' : ''}</div>
      <div class="lore-name">Goku · ${esc(f.form)}</div>
      <p class="lore-text">${esc(f.lore || 'No lore recorded for this form yet.')}</p>
      <div class="lore-facts">${loreFacts(f).map(x => `<span>${esc(x)}</span>`).join('')}</div>`;

    function renderLore(forms) {
      const f = forms[forms.length - 1];
      document.getElementById('loreEpithet').textContent = f ? 'Chapter ' + f.level + ' · Now' : '';
      document.getElementById('loreName').textContent = f && f.form ? 'Goku · ' + f.form : 'Goku';
      document.getElementById('loreText').textContent = (f && f.lore) || (f ? 'No lore recorded for this form yet.' : 'Your story appears here after tonight’s run.');
      document.getElementById('loreFacts').replaceChildren(...(f ? loreFacts(f) : []).map(fact => {
        const span = document.createElement('span');
        span.textContent = fact;
        return span;
      }));
    }

    // A form's tile opens its story: the clip plays above it. Back returns to the grid.
    function openForm(level) {
      const forms = (hero && Array.isArray(hero.forms)) ? hero.forms : [];
      const f = forms.find(x => String(x.level) === String(level));
      if (!f) return;
      const now = f === forms[forms.length - 1];
      document.querySelectorAll('.form video').forEach(v => v.remove());
      const detail = document.getElementById('formDetail');
      detail.innerHTML = `<button class="form-back" type="button" id="formBack">← All forms</button>
        <div class="form form-big" data-level="${esc(f.level)}" style="background-image:url('${esc(still(f))}')" role="button" tabindex="0" aria-label="${esc(f.form)}. Tap to replay.">
          ${now ? '<span class="form-now">Now</span>' : ''}
        </div>
        <div class="lore">${loreHtml(f, now)}</div>`;
      document.getElementById('forms').hidden = true;
      detail.hidden = false;
      document.getElementById('panelForms').scrollTop = 0;
      toggleFormClip(detail.querySelector('.form'));
    }

    function closeForm() {
      document.querySelectorAll('.form video').forEach(v => v.remove());
      const detail = document.getElementById('formDetail');
      if (detail.hidden) return;
      detail.hidden = true;
      detail.innerHTML = '';
      document.getElementById('forms').hidden = false;
    }

    // ---- 📡 Transmissions (Roy, 8 Oct 2026): Goku, Vegeta and friends react to today's data ----
    // Each flip picks a scouter reading or a message from a character, mostly
    // about what the data says right now (recovery, form, load ratio, ki, this
    // week, days off, bad habits, the hour). Gold = rare, purple = the scouter
    // overloads (very rare). Tap the reading to rescan; poke it too often and it
    // overheats. Only allies talk, never a form, move or boss still to come.
    const CAST = {
      goku: { name: 'Goku', color: '#ffb347' },
      vegeta: { name: 'Vegeta', color: '#7fb2ff' },
      piccolo: { name: 'Piccolo', color: '#8fe38f' },
      krillin: { name: 'Krillin', color: '#ffd0a8' },
      bulma: { name: 'Bulma', color: '#66e0d9' },
      roshi: { name: 'Master Roshi', color: '#ff9ec7' },
      kingkai: { name: 'King Kai', color: '#9fd0ff' },
      whis: { name: 'Whis', color: '#c9b6ff' },
      beerus: { name: 'Beerus', color: '#d59cff' }
    };
    const CAUGHT_KEY = 'mainQuest.transmissions.v1';
    const LEGEND_CHANCE = 0.03, TALK_CHANCE = 0.7;
    const hourNow = () => Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Amsterdam', hour: '2-digit', hourCycle: 'h23' }).format(new Date()));
    const weekdayNow = () => new Date(Date.parse(todayKey() + 'T12:00:00Z')).getUTCDay();
    const hm = m => Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + String(m % 60).padStart(2, '0') : '');

    function transmissions() {
      const talk = [], filler = [], rare = [], legend = [];
      const say = (list, who, ...lines) => lines.forEach(text => list.push({ who: who, text: text }));
      const p = power || {};
      const load = p.load && Array.isArray(p.load.long) ? p.load : null;
      const last = a => (Array.isArray(a) && a.length ? a[a.length - 1] : null);
      const rec = load ? last(load.recovery) : null;
      const ratio = load ? last(load.ratio) : null;
      const bands = (load && load.ratio_bands) || { low: 0.8, optimal: 1.3, high: 1.5 };
      const form = p.form_state || (load ? last(load.form) : null);
      const ki = p.ki && Array.isArray(p.ki.days) && p.ki.days.length ? p.ki : null;
      const week = p.week || {};
      const cal = p.gravity && Array.isArray(p.gravity.calendar) ? p.gravity.calendar : [];
      const hour = hourNow(), wd = weekdayNow();
      const r = (hero && hero.records) || {};

      // Recovery this morning.
      if (rec === 'easy') {
        say(talk, 'piccolo', 'Your body says rest. Sit down and meditate. Or at least sit down.');
        say(talk, 'goku', 'Take it easy today! I once trained at 100× gravity and nearly blew myself up. Don’t be me.');
        say(talk, 'vegeta', 'Rest, then. Even the Prince of all Saiyans sleeps. Briefly. Angrily.');
        say(talk, 'bulma', '“Take it easy” is not a suggestion. It’s a diagnosis.');
      } else if (rec === 'steady') {
        say(talk, 'krillin', 'Go steady today. Trust me, I’ve died enough times to know when to pace myself.');
        say(talk, 'goku', 'Go steady! A light session, then food. Mostly the food.');
        say(talk, 'piccolo', 'Steady. Not soft. There’s a difference.');
      } else if (rec === 'good') {
        say(talk, 'goku', 'You’re good to go! Wanna spar? Come on, just a little!');
        say(talk, 'vegeta', 'Fully recovered and you’re reading a scouter? Kakarot is already outside.');
        say(talk, 'roshi', 'Good to go! In my day we trained with turtle shells on our backs. Get moving.');
        say(talk, 'krillin', 'Recovery’s green. I checked twice. No excuses today, man.');
      }

      // Form, from the load chart.
      if (form === 'Rusty') {
        say(talk, 'vegeta', 'Rusty? A Saiyan who doesn’t train is just a guy with great hair.');
        say(talk, 'goku', 'Hey, you’ve gone quiet! Wanna go for a run? I’ll race you!');
        say(talk, 'piccolo', 'Your load is dropping. The gains are leaving. They didn’t say goodbye.');
        say(talk, 'kingkai', 'Rusty! Heh. Rusty. Like my jokes. Get it? …Now go train.');
      } else if (form === 'Steady') {
        say(talk, 'piccolo', 'Steady. Comfortable. Comfortable is where power goes to nap.');
        say(talk, 'goku', 'Steady is nice! But a harder week would be even nicer.');
        say(talk, 'vegeta', 'Steady. How thrilling. Wake me when you actually push.');
      } else if (form === 'Building') {
        say(talk, 'goku', 'Ooh, you’re building! I can feel your power going up from here!');
        say(talk, 'vegeta', 'Hmph. You’re actually working. Don’t let it go to your head.');
        say(talk, 'krillin', 'Building block? Man, you’re starting to scare me a little.');
        say(talk, 'piccolo', 'Tired legs are the price. Pay it.');
      } else if (form === 'Overreaching') {
        say(talk, 'bulma', 'Overreaching! Even my machines get a day off, and they’re machines.');
        say(talk, 'krillin', 'Dude, slow down. You’ll end up in a healing tank like Vegeta.');
        say(talk, 'vegeta', 'I did NOT end up in… fine. Rest a day. Then come back stronger.');
        say(talk, 'roshi', 'Overreaching! Ho ho, the young never listen. Eat, sleep, then train.');
        say(talk, 'goku', 'Whoa, that’s too much even for me! Rest so your power can catch up.');
      }

      // Load ratio today.
      if (ratio !== null && ratio !== undefined) {
        const rv = Number(ratio).toFixed(2);
        if (ratio > bands.high) {
          say(talk, 'bulma', `Load ratio ${rv}. That’s not training, that’s a stress test.`);
          say(talk, 'piccolo', `Ratio ${rv}. You’re spending power faster than you build it.`);
        } else if (ratio < bands.low) {
          say(talk, 'vegeta', `Ratio ${rv}. My grandmother trains harder. Saiyans don’t even have grandmothers.`);
          say(talk, 'kingkai', `Ratio ${rv}. Even Bubbles works harder than this, and he’s a monkey.`);
        } else if (ratio <= bands.optimal) {
          say(talk, 'goku', `Ratio ${rv}. Right in the sweet spot! Keep that up!`);
          say(talk, 'piccolo', `Ratio ${rv}. Optimal. Don’t celebrate. Keep it there.`);
        }
      }

      // 🔥 Ki charge.
      if (ki) {
        const now = Number(ki.level) || 0, peak = Number(ki.peak) || 5, tapped = Number((last(ki.days) || {}).faps) || 0;
        if (now === 0 && tapped) {
          say(talk, 'roshi', 'Ki empty? Ho ho… I know that look. I’ve worn that look.');
          say(talk, 'vegeta', 'You spent your ki on THAT? Pathetic.');
          say(talk, 'bulma', 'Your ki is empty, and honestly so is my patience.');
        } else if (now === 0) {
          say(talk, 'goku', 'Ki’s empty, but it fills back up. One clean day at a time!');
        } else if (now >= peak) {
          say(talk, 'goku', 'Whoa, your ki is at full power! I can feel it from here!');
          say(talk, 'vegeta', 'Full ki. Finally, someone worth my time.');
          say(talk, 'roshi', 'Full charge! Discipline. I respect it. I don’t have it, but I respect it.');
        } else {
          say(talk, 'piccolo', `Ki at ${now} of ${peak}. Keep your focus. And your hands to yourself.`);
          say(talk, 'krillin', `Ki at ${now} of ${peak}. I’m not asking how. I’m just proud.`);
        }
      }

      // This week and the Senzu bean.
      const mins = Number(week.minutes) || 0;
      if (week.senzu) {
        say(talk, 'krillin', 'A Senzu bean! Can I have half? I’ll owe you.');
        say(talk, 'goku', 'You earned a Senzu! I’d eat it right away. Then ask for another.');
      } else if (mins >= 240 && (wd >= 5 || wd === 0)) {
        say(talk, 'goku', `Only ${hm(360 - mins)} to the Senzu bean! Come on, come on!`);
      } else if (wd === 0 && mins < 180) {
        say(talk, 'vegeta', `${hm(mins)} this week. And it’s Sunday. Disgraceful.`);
      } else if (wd === 1 && mins < 60) {
        say(talk, 'goku', 'New week! Clean slate! Let’s gooo!');
      }

      // Days since the last workout (the gravity calendar, today last).
      if (cal.length) {
        let off = 0;
        for (let i = cal.length - 1; i >= 0 && !cal[i]; i--) off++;
        if (off === 0) {
          say(talk, 'goku', 'You trained today! Now for the best part: eating.');
          say(talk, 'vegeta', 'One workout. Don’t expect applause.');
          say(talk, 'piccolo', 'Good session. Now recover. Properly.');
        } else if (off >= 3 && off < cal.length) {
          say(talk, 'vegeta', `${off} days without training. Kakarot trains in his sleep. Literally.`);
          say(talk, 'krillin', `${off} days off? Should I send a search party?`);
          say(talk, 'goku', `${off} days! I’m getting bored over here. Train with me!`);
        }
      }

      // Today's habits, live from the boss card.
      if (liveHeal.day === gameDay(Date.now())) {
        if (liveHeal.damage > 0) {
          say(talk, 'vegeta', `You took ${fmtNum(liveHeal.damage)} damage today from your OWN habits. You’re fighting yourself and losing.`);
          say(talk, 'piccolo', `${fmtNum(liveHeal.damage)} HP lost today. Nobody hit you. Think about that.`);
        }
        if (liveHeal.hp > 0) say(talk, 'goku', `+${fmtNum(liveHeal.hp)} HP from good habits today. That’s like a mini Senzu!`);
      }

      // Power level and its trend.
      const pl = Number(p.power_level) || 0, ch = Number(p.trend_change_pct);
      if (pl > 9000) rare.push({ who: 'vegeta', text: `WHAT?! ${fmtNum(pl)}?! There’s no way that can be right!` });
      if (ch > 0) {
        say(talk, 'goku', `Your power’s up ${ch}% in twelve weeks! That’s awesome!`);
        say(talk, 'vegeta', `Up ${ch}%. I noticed. I’m not impressed. …Slightly impressed.`);
      } else if (ch < 0) {
        say(talk, 'piccolo', `Power down ${Math.abs(ch)}% in twelve weeks. The fix is boring: show up.`);
        say(talk, 'vegeta', `Down ${Math.abs(ch)}%. Did you think the power would maintain itself?`);
      }
      if (r.current_run >= 3) {
        say(talk, 'goku', `${r.current_run} success days in a row! Don’t stop now!`);
        say(talk, 'vegeta', `${r.current_run} days in a row. Ninety-nine more and we’ll talk.`);
      }

      // The hour.
      if (hour >= 23 || hour < 4) {
        say(talk, 'bulma', 'It’s the middle of the night. Sleep is recovery. Close the scouter.');
        say(talk, 'goku', 'Can’t sleep either? I’m hungry. Is that why?');
        say(talk, 'piccolo', 'Go to bed. I don’t even sleep and I think you should.');
      } else if (hour >= 5 && hour < 8) {
        say(talk, 'goku', 'Morning! Breakfast first, then training. Or both at once!');
        say(talk, 'vegeta', 'Up early. …Acceptable.');
      }

      // Always on air.
      say(filler, 'krillin', 'Hey, have you seen my scouter? …Oh. You’re wearing it.');
      say(filler, 'goku', 'Is it lunch yet?');
      say(filler, 'vegeta', 'Stop staring at the scouter. Be the number.');
      say(filler, 'bulma', 'Please stop tapping the scouter. It’s a precision instrument.');
      say(filler, 'kingkai', 'Why did the Saiyan cross the road? To train on the other side! …Tough crowd.');
      say(filler, 'roshi', 'Lesson one: work hard. Lesson two: nap hard.');
      say(filler, 'piccolo', 'I’m not here. I’m meditating. Go away.');
      say(filler, 'goku', 'Hey, it’s me, Goku! …Okay, that’s all I had.');

      say(rare, 'vegeta', 'Fine. I’ll say it once. You’re… not completely useless.');
      say(rare, 'goku', 'You know what? You remind me of me. That’s a compliment!');
      say(rare, 'kingkai', 'I just laughed at my own joke for ten minutes. You missed it. Train harder to make up for it.');

      say(legend, 'whis', 'Oh my. Your scouter exploded. Do try to be less dramatic, it’s terribly messy.');
      say(legend, 'beerus', 'You woke me for THIS reading? …Hm. Not bad. Now let me sleep.');
      say(legend, 'vegeta', 'The scouter broke?! Bulma! BULMA! …Don’t tell Kakarot.');
      return { talk: talk, filler: filler, rare: rare, legend: legend };
    }

    // One reading per flip, never one of the last few. Now and then a rare one.
    function readings() {
      const r = (hero && hero.records) || {};
      const forms = (hero && hero.forms) || [];
      const days = (hero && hero.days) || [];
      const common = [], rare = [];
      const xp = Number(r.xp || 0);
      if (xp) common.push(xp > 9000 ? `Power reading: ${fmtNum(xp)} XP. It's over 9000!` : `Power reading: ${fmtNum(xp)} XP.`);
      if (r.current_run > 1) common.push(`${r.current_run} success days in a row.`);
      if (r.best_gain) common.push(`Biggest day so far: ${fmtDay(r.best_gain.date)}, +${fmtNum(r.best_gain.gain)} XP.`);
      if (r.movement_days) common.push(`${r.movement_days} success days since ${fmtDay(hero.started)}.`);
      if (r.workouts) common.push(`${r.workouts} workouts logged on the quest.`);
      if (r.longest_run > 2) common.push(`Longest run: ${r.longest_run} success days without a break.`);
      if (r.fastest_level) common.push(`Fastest transformation: ${r.fastest_level.form} in ${r.fastest_level.days} days.`);
      if (r.stage) common.push(`Stage ${r.stage} of the Main Quest, cleared by showing up.`);
      const day = questDay();
      if (day) common.push(`Day ${day} of the quest. Still standing.`);
      const earned = days.find(d => d.gain != null);
      if (earned && earned.gain) common.push(`${fmtDay(earned.date, true)} earned you +${fmtNum(earned.gain)} XP.`);
      for (const f of forms.slice(0, -1)) if (f.reached) common.push(`Flashback: on ${fmtDay(f.reached)} you became ${f.form}.`);
      if (forms.length > 1 && forms[0].reached) rare.push(`Memory unlocked: ${fmtDay(forms[0].reached)}, the day it all started as ${forms[0].form}. Look at you now.`);
      // Goku's power (from the Goku card's state).
      if (power) {
        const pl = Number(power.power_level) || 0, ch = power.trend_change_pct, g = power.gravity || {};
        if (pl) common.push(pl > 9000 ? `Power level ${fmtNum(pl)}. It's over 9000!` : `Power level ${fmtNum(pl)}${ch > 0 ? `, up ${ch}% in twelve weeks` : ''}.`);
        if (g.days) common.push(`Gravity ${fmtNum(g.gravity)}×: ${g.days} training days in the last 28.`);
        if (power.week && power.week.senzu) rare.push('Six hours this week. The Senzu bean is yours.');
        const FORM_READING = {
          Rusty: 'Short-term load is low. Time to build.',
          Steady: 'Holding steady. A harder week turns this into growth.',
          Building: 'Building block in progress. The power level is climbing.',
          Overreaching: 'Overreaching. An easier day lets the gains land.'
        };
        if (FORM_READING[power.form_state]) common.push(FORM_READING[power.form_state]);
      }
      rare.push('Reading unstable… the scouter just cracked.', 'The only one you need to beat is the you from yesterday.', 'Power comes in response to a need, not a desire.', 'A Saiyan never stops at their limit.', 'Somewhere, Vegeta just clenched his fist.');
      return { common: common, rare: rare };
    }

    function nextReading() {
      const pool = readings(), tx = transmissions();
      let history = [];
      try { history = JSON.parse(localStorage.getItem(READING_HISTORY_KEY) || '[]'); } catch (_) {}
      if (!Array.isArray(history)) history = [];
      const roll = Math.random();
      let tier = 'common', list;
      if (roll < LEGEND_CHANCE) { tier = 'legend'; list = tx.legend; }
      else if (roll < LEGEND_CHANCE + RARE_CHANCE) { tier = 'rare'; list = pool.rare.map(text => ({ text: text })).concat(tx.rare); }
      else if (Math.random() < TALK_CHANCE || !pool.common.length) list = tx.talk.length && Math.random() < 0.8 ? tx.talk : tx.filler;
      else list = pool.common.map(text => ({ text: text }));
      const fresh = list.filter(t => !history.includes(t.text));
      const reading = Object.assign({ tier: tier }, pick(fresh.length ? fresh : list));
      try { localStorage.setItem(READING_HISTORY_KEY, JSON.stringify([...history, reading.text].slice(-8))); } catch (_) {}
      // Every message caught is remembered; a new one gets a NEW chip.
      if (reading.who) {
        const id = reading.who + '|' + reading.text.replace(/[\d.,%+×−-]+/g, '#');
        let caught = [];
        try { caught = JSON.parse(localStorage.getItem(CAUGHT_KEY) || '[]'); } catch (_) {}
        if (!Array.isArray(caught)) caught = [];
        reading.isNew = !caught.includes(id);
        if (reading.isNew) { caught.push(id); try { localStorage.setItem(CAUGHT_KEY, JSON.stringify(caught)); } catch (_) {} }
        reading.caught = caught.length;
      }
      return reading;
    }

    function showReading(reading) {
      reading = reading || nextReading();
      const label = document.getElementById('scouterLabel');
      const who = reading.who && CAST[reading.who];
      scouterEl.classList.toggle('rare', reading.tier === 'rare');
      scouterEl.classList.toggle('legend', reading.tier === 'legend');
      scouterEl.classList.toggle('hot', !!reading.hot);
      scouterEl.classList.remove('boom');
      if (reading.tier === 'legend' && !reduceMotion) { void scouterEl.offsetWidth; scouterEl.classList.add('boom'); }
      const title = reading.hot ? '🔥 Scouter overheating' : reading.tier === 'legend' ? '💥 Scouter overload' : reading.tier === 'rare' ? '⚡ Rare reading' : who ? '📡 Incoming' : 'Scouter reading';
      label.innerHTML = `<span>${esc(title)}${who ? ` · <b class="tx-who" style="color:${who.color}">${esc(who.name)}</b>` : ''}${reading.isNew ? ' <span class="tx-new">New</span>' : ''}</span>` +
        `<span class="tx-count">${reading.hot ? 'cooling down' : (reading.caught ? esc(reading.caught) + ' caught · ' : '') + 'tap to rescan'}</span>`;
      clearInterval(typeTimer);
      if (reduceMotion) { readingEl.textContent = reading.text; return; }
      // Typed out like a scouter readout.
      let i = 0;
      readingEl.textContent = '';
      readingEl.classList.add('typing');
      typeTimer = setInterval(() => {
        i += 1;
        readingEl.textContent = reading.text.slice(0, i);
        if (i >= reading.text.length) { clearInterval(typeTimer); readingEl.classList.remove('typing'); }
      }, 28);
    }

    // Tap the reading to rescan. Three quick rescans and it overheats for a bit.
    const HOT_LINES = [
      { who: 'bulma', text: 'Stop poking it! It’s overheating. Give it a minute.' },
      { who: 'vegeta', text: 'You broke ANOTHER scouter? Wait. Like a warrior.' },
      { who: 'krillin', text: 'Uh, it’s smoking. Is it supposed to smoke? Let it cool down.' },
      { who: 'roshi', text: 'Patience, young one. The scouter needs a nap. So do I.' }
    ];
    let scans = [], hotUntil = 0;
    function rescan() {
      const now = Date.now();
      if (now < hotUntil) { readingEl.classList.remove('shake'); void readingEl.offsetWidth; readingEl.classList.add('shake'); return; }
      scans = scans.filter(t => now - t < 60000).concat(now);
      if (scans.length > 3) {
        scans = [];
        hotUntil = now + 45000;
        showReading(Object.assign({ tier: 'common', hot: true }, pick(HOT_LINES)));
        return;
      }
      showReading();
    }

    // ---- Goku's power (quest-engine src/power.js, 2 Oct 2026) ----
    // Each part drives one thing: gravity -> XP, signature moves -> attack,
    // the ki shield -> shield, the 6-hour week's Senzu bean -> HP.
    const SENZU_SEEN_KEY = 'mainQuest.senzuSeen.v1';
    const senzuEl = document.getElementById('senzu');
    let power = null;
    let powerKey = '';
    let senzuTimer = null;

    function renderPower(p, curHp, maxHp, hpPct) {
      power = p && typeof p === 'object' ? p : null;
      const shieldEl = document.getElementById('hpShield');
      if (!power) {
        shieldEl.style.width = '0';
        hpHudEl.dataset.shield = '0';
        progressHudEl.dataset.senzu = '0';
        renderScouterPower();
        return;
      }

      // 🛡️ The ki shield sits on the HP bar after the HP, and bad habits hit it first.
      // The front shows nothing else of the power (Roy: the animation stays clear).
      const amount = Math.max(0, Math.round(Number(power.shield && power.shield.amount) || 0));
      hpHudEl.dataset.shield = amount > 0 ? '1' : '0';
      if (amount > 0 && Number.isFinite(hpPct) && maxHp > 0) {
        shieldEl.style.left = hpPct + '%';
        shieldEl.style.width = Math.min((amount / maxHp) * 100, 100 - hpPct) + '%';
        hpNumEl.innerHTML = esc(hpNumEl.textContent) + ' <span class="hp-shield-num">+' + esc(fmtNum(amount)) + '</span>';
      } else {
        shieldEl.style.width = '0';
      }

      // 🫘 The 6-hour week: Senzu green until Sunday night, and the Senzu banner once.
      const week = power.week || {};
      progressHudEl.dataset.senzu = week.senzu ? '1' : '0';
      let seen = '';
      try { seen = localStorage.getItem(SENZU_SEEN_KEY) || ''; } catch (_) {}
      if (week.senzu && week.monday && seen !== week.monday && senzuEl.hidden) {
        document.getElementById('senzuText').textContent = (Number(week.hours) || 0) + ' h trained this week';
        senzuEl.hidden = false;
        try { localStorage.setItem(SENZU_SEEN_KEY, week.monday); } catch (_) {}
        clearTimeout(senzuTimer);
        senzuTimer = setTimeout(() => { senzuEl.hidden = true; }, 9000);
      }
      renderScouterPower();
      if (!document.getElementById('panelMoves').hidden) renderMoves();
    }

    senzuEl.addEventListener('click', event => { event.stopPropagation(); senzuEl.hidden = true; });

    const smallImage = url => String(url || '').replace('/image/upload/', '/image/upload/w_360,h_480,c_fill,g_north,f_auto/');
    const smallClip = url => String(url || '').replace(/\/video\/upload\/(ac_none,so_1\.0\/)?/, '/video/upload/ac_none,w_540,h_720,c_fill,g_north/');
    // The tile's picture is the clip's first frame, cropped like the clip: the
    // move image is 2:3 but the clip is 9:16 (its sides cut off), so the image
    // looked zoomed in as soon as the clip started (Roy, 3 Oct 2026).
    const clipStill = url => smallClip(url).replace('/ac_none,', '/so_0,').replace(/\.mp4$/, '.jpg');
    const MOVE_BADGE = { charged: 'Charged', used: 'Used this week', dormant: 'Dormant', awake: 'Awake' };

    function sparkPath(values) {
      const v = values.map(x => Number(x) || 0);
      if (v.length < 2) return '';
      // Scaled to its own range, so a few weeks of progress show as a climb.
      const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
      return v.map((y, i) => (i ? 'L' : 'M') + Math.round((i / (v.length - 1)) * 240) + ' ' + Math.round(hi === lo ? 18 : 33 - ((y - lo) / span) * 28)).join(' ');
    }

    // The load chart (Roy, 2 Oct 2026): 84 days of long-term load (fitness x 100,
    // the power level) and short-term load (fatigue x 100), the move marks as
    // dashed lines and a strip with each day's form. Under it (5 Oct 2026) the
    // load ratio (short ÷ long, with the engine's bands) and each morning's
    // recovery. A finger on it reads a day across all rows.
    const LD_W = 246, LD_H = 150, LD_RH = 58;
    const REC_TEXT = { good: 'Good to go', steady: 'Go steady', easy: 'Take it easy' };
    const RATIO_ZONE = (r, b) => (r === null || r === undefined ? null : r < b.low ? 'Low' : r <= b.optimal ? 'Optimal' : r <= b.high ? 'High' : 'Risk');
    let loadKey = '';
    function loadChart(load, moves) {
      const long = load.long.map(Number), short = load.short.map(Number), n = long.length;
      // Only the marks of moves already unlocked: moves still to come are a
      // surprise, so neither their names nor their marks are shown (Roy).
      const marks = moves.filter(m => m.name && m.state !== 'locked').map(m => ({ p: Number(m.power), n: m.name })).filter(m => m.p > 0);
      const yMax = Math.max(1, ...long, ...short) * 1.05;
      const x = i => (i / Math.max(1, n - 1)) * LD_W;
      const y = v => 8 + (1 - v / yMax) * (LD_H - 12);
      const path = vals => vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
      // Two marks close together: the second label goes to the right, so they never overlap.
      let prevY = null, right = false;
      const lines = marks.filter(m => m.p <= yMax).sort((a, b) => a.p - b.p).map(m => {
        const my = y(m.p);
        right = prevY !== null && Math.abs(prevY - my) < 18 ? !right : false;
        prevY = my;
        return `<line x1="0" x2="${LD_W}" y1="${my}" y2="${my}" stroke="rgba(255,214,92,.55)" stroke-dasharray="3 4" stroke-width="1" vector-effect="non-scaling-stroke"/>` +
          `<text x="${right ? LD_W - 2 : 2}" y="${my - 3}" text-anchor="${right ? 'end' : 'start'}" font-size="8" font-weight="800" fill="rgba(255,214,92,.8)">${esc(m.n)} · ${esc(fmtNum(m.p))}</text>`;
      }).join('');
      const start = Date.parse(load.from + 'T12:00:00Z');
      const dayOf = i => new Date(start + i * 86400000);
      let months = '';
      for (let i = 0; i < n; i++) { const d = dayOf(i); if (d.getUTCDate() === 1) months += `<span style="left:${(i / (n - 1)) * 100}%">${MONTHS[d.getUTCMonth()]}</span>`; }
      const ratio = Array.isArray(load.ratio) && load.ratio.length === n ? load.ratio.map(r => (r === null ? null : Number(r))) : null;
      const rec = Array.isArray(load.recovery) && load.recovery.length === n ? load.recovery : null;
      const bands = load.ratio_bands || { low: 0.8, optimal: 1.3, high: 1.5 };
      const ry = r => 2 + (1 - Math.min(2, Math.max(0, r)) / 2) * (LD_RH - 4);
      let ratioRow = '';
      if (ratio) {
        const band = (a, b, c) => `<rect x="0" width="${LD_W}" y="${ry(b)}" height="${ry(a) - ry(b)}" fill="${c}"/>`;
        // Days before any workout have no ratio: the line starts at the first one.
        let d = '', on = false;
        ratio.forEach((r, i) => { if (r === null) { on = false; return; } d += (on ? 'L' : 'M') + x(i).toFixed(1) + ' ' + ry(r).toFixed(1); on = true; });
        const lastR = ratio[n - 1];
        ratioRow = `<div class="ld-row" data-info="ratio"><span>Load ratio · short ÷ long</span><b>${lastR === null ? '–' : esc(lastR.toFixed(2)) + ' · ' + esc(RATIO_ZONE(lastR, bands))}</b></div>` +
          `<svg class="ld-ratio" viewBox="0 0 ${LD_W} ${LD_RH}" preserveAspectRatio="none" aria-label="Load ratio, last 12 weeks">` +
          band(bands.low, bands.optimal, 'rgba(61,220,132,.16)') + band(bands.high, 2, 'rgba(255,95,95,.14)') +
          `<line x1="0" x2="${LD_W}" y1="${ry(1)}" y2="${ry(1)}" stroke="rgba(255,255,255,.12)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>` +
          `<text x="2" y="${ry(bands.optimal) + 8}" font-size="7" font-weight="800" fill="rgba(125,255,176,.75)">${esc(bands.low)}–${esc(bands.optimal)}</text>` +
          `<text x="2" y="${ry(2) + 8}" font-size="7" font-weight="800" fill="rgba(255,159,159,.8)">${esc(bands.high)}+</text>` +
          `<path d="${d}" fill="none" stroke="#cfe3ff" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>` +
          (lastR === null ? '' : `<circle cx="${x(n - 1)}" cy="${ry(lastR)}" r="2.6" fill="#cfe3ff"/>`) +
          `<circle class="ld-cr" r="3" fill="#cfe3ff" visibility="hidden"/></svg>`;
      }
      const recRow = rec
        ? `<div class="ld-row" data-info="recovery"><span>Recovery · each morning</span><b>${rec[n - 1] ? 'Today ' + esc(REC_TEXT[rec[n - 1]] || rec[n - 1]) : 'No night yet today'}</b></div>` +
          `<div class="ld-rec">${rec.map(r => `<span class="rc-${REC_TEXT[r] ? r : 'none'}"></span>`).join('')}</div>`
        : '';
      const html =
        `<div class="ld-wrap"><svg class="ld-chart" viewBox="0 0 ${LD_W} ${LD_H}" preserveAspectRatio="none" aria-label="Long-term and short-term load, last 12 weeks">` + lines +
        `<path d="${path(long)} L${LD_W} ${LD_H} L0 ${LD_H}Z" fill="rgba(125,255,176,.14)"/>` +
        `<path d="${path(short)}" fill="none" stroke="#ff8fa3" stroke-width="1.6" stroke-linejoin="round" opacity=".9" vector-effect="non-scaling-stroke"/>` +
        `<path d="${path(long)}" fill="none" stroke="#7dffb0" stroke-width="2.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>` +
        `<circle class="ld-cf" r="3.5" fill="#7dffb0" visibility="hidden"/><circle class="ld-ca" r="3" fill="#ff8fa3" visibility="hidden"/></svg>` +
        `<div class="ld-strip">${load.form.map(f => `<span class="fs-${esc(f)}"></span>`).join('')}</div>` +
        ratioRow + recRow +
        `<div class="ld-x">${months}</div><div class="ld-cursor" hidden></div><div class="ld-tip" hidden></div></div>`;
      const bind = wrap => {
        const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.ld-tip'), cur = wrap.querySelector('.ld-cursor');
        const cr = wrap.querySelector('.ld-cr');
        const marks = [...svg.querySelectorAll('.ld-cf,.ld-ca')];
        const show = i => {
          const cx = x(i), d = dayOf(i);
          svg.querySelector('.ld-cf').setAttribute('cx', cx); svg.querySelector('.ld-cf').setAttribute('cy', y(long[i]));
          svg.querySelector('.ld-ca').setAttribute('cx', cx); svg.querySelector('.ld-ca').setAttribute('cy', y(short[i]));
          marks.forEach(m => m.setAttribute('visibility', 'visible'));
          const r = ratio ? ratio[i] : null;
          if (cr) { cr.setAttribute('cx', cx); if (r !== null) cr.setAttribute('cy', ry(r)); cr.setAttribute('visibility', r === null ? 'hidden' : 'visible'); }
          const rc = rec ? rec[i] : null;
          tip.innerHTML = `${WEEKDAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}<br><span class="f">Long-term ${esc(fmtNum(long[i]))}</span><br><span class="a">Short-term ${esc(fmtNum(short[i]))}</span>` +
            (ratio && r !== null ? `<br><span class="r">Ratio ${esc(r.toFixed(2))} · ${esc(RATIO_ZONE(r, bands))}</span>` : '') +
            `<br><span class="form-chip fs-${esc(load.form[i])}">${esc(load.form[i])}</span>` +
            (rec ? ` <span class="form-chip rc-${REC_TEXT[rc] ? rc : 'none'}">${esc(REC_TEXT[rc] || 'No night')}</span>` : '');
          tip.hidden = false;
          const w = wrap.clientWidth, left = (cx / LD_W) * w;
          cur.style.left = left + 'px'; cur.hidden = false;
          tip.style.left = Math.max(0, Math.min(w - tip.offsetWidth, left + (left > w / 2 ? -tip.offsetWidth - 8 : 8))) + 'px';
        };
        const hide = () => { tip.hidden = true; cur.hidden = true; marks.forEach(m => m.setAttribute('visibility', 'hidden')); if (cr) cr.setAttribute('visibility', 'hidden'); };
        const at = ev => { const r = wrap.getBoundingClientRect(); return Math.max(0, Math.min(n - 1, Math.round(((ev.clientX - r.left) / r.width) * (n - 1)))); };
        wrap.addEventListener('pointerdown', ev => { ev.stopPropagation(); show(at(ev)); });
        wrap.addEventListener('pointermove', ev => show(at(ev)));
        wrap.addEventListener('pointerleave', hide);
        wrap.addEventListener('pointercancel', hide);
        // The row titles explain themselves (the chart keeps taps to itself).
        wrap.addEventListener('click', ev => { ev.stopPropagation(); const t = ev.target.closest('.ld-row[data-info]'); if (t) { hide(); showInfo(t.dataset.info); } });
      };
      return { html, bind };
    }

    // Scouter tab: power level and the load chart inside the scouter box;
    // gravity and this week as two tiles under it.
    function renderScouterPower() {
      const box = document.getElementById('scPower');
      const cells = document.getElementById('powerCells');
      if (!power) { box.hidden = true; cells.hidden = true; loadKey = ''; renderKi(); return; }
      const pl = Number(power.power_level) || 0;
      const line = sparkPath(Array.isArray(power.trend) ? power.trend : []);
      const change = power.trend_change_pct;
      const moves = Array.isArray(power.moves) ? power.moves : [];
      const load = power.load && Array.isArray(power.load.long) && power.load.long.length > 1 ? power.load : null;
      const head =
        `<div data-info="power"><span class="label">Power level · long-term load</span>` +
        `<div><span class="pl-big">${esc(fmtNum(pl))}</span>${change !== null && change !== undefined ? `<span class="pl-trend${change < 0 ? ' down' : ''}">${change < 0 ? '▼' : '▲'} ${esc(Math.abs(change))}% in 12 wk</span>` : ''}</div></div>`;
      if (load) {
        // Redrawn only when the numbers change, so a finger on the chart is not interrupted.
        const key = JSON.stringify([pl, change, load, moves.map(m => [m.power, m.name])]);
        if (key !== loadKey) {
          loadKey = key;
          const last = load.long.length - 1;
          const chart = loadChart(load, moves);
          box.innerHTML = head +
            `<div class="ld-legend"><span data-info="long"><i style="background:#7dffb0"></i>Long-term ${esc(fmtNum(load.long[last]))}</span><span data-info="short"><i style="background:#ff8fa3"></i>Short-term ${esc(fmtNum(load.short[last]))}</span><span class="form-chip fs-${esc(load.form[last])}" data-info="form">${esc(load.form[last])}</span></div>` +
            chart.html;
          chart.bind(box.querySelector('.ld-wrap'));
        }
      } else box.innerHTML = head +
        (line ? `<svg class="spark" viewBox="0 0 240 36" preserveAspectRatio="none" aria-hidden="true"><path d="${line} L240 36 L0 36Z" fill="rgba(125,255,176,.16)"/><path d="${line}" fill="none" stroke="#7dffb0" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>` : '');
      box.hidden = false;

      const g = power.gravity || {};
      const cal = (Array.isArray(g.calendar) ? g.calendar : []).map((d, i, all) => `<span class="${d ? 't' : ''}${i === all.length - 1 ? ' today' : ''}"></span>`).join('');
      const week = power.week || {};
      const hrs = Math.floor((Number(week.minutes) || 0) / 60), mins = (Number(week.minutes) || 0) % 60;
      cells.innerHTML =
        `<div class="pcell gv" data-info="gravity"><div class="pcell-num">${esc(fmtNum(g.gravity))}×</div><span class="label">Gravity · +${esc(Math.round((Number(g.xp_bonus) || 0) * 1000) / 10)}% XP</span><div class="cal" title="${esc(g.days || 0)} training days in the last 28">${cal}</div></div>` +
        `<div class="pcell wk" data-info="week"><div class="pcell-num">${hrs} h ${String(mins).padStart(2, '0')}</div><span class="label">This week · ${week.senzu ? '🫘 Senzu earned' : '🫘 at 6 h'}</span></div>`;
      cells.hidden = false;
      renderKi();
    }

    // 🔥 Ki charge: the charge now as 5 bars, and the last 28 days as a graph:
    // one bar per day at its charge (peak glows, empty is blue) and a blue ball
    // per Fap tap. A finger on the graph reads a day.
    const KI_W = 280, KI_H = 90;
    let kiKey = '';
    function renderKi() {
      const box = document.getElementById('kiBox');
      const ki = power && power.ki && Array.isArray(power.ki.days) && power.ki.days.length ? power.ki : null;
      if (!ki) { box.hidden = true; kiKey = ''; return; }
      const key = JSON.stringify(ki);
      if (key === kiKey) return;
      kiKey = key;
      const peak = Number(ki.peak) || 5, now = Number(ki.level) || 0, days = ki.days, n = days.length;
      const col = KI_W / n, bw = Math.max(1, col - 2), step = (KI_H - 26) / peak, base = KI_H;
      const dayOf = d => new Date(d + 'T12:00:00Z');
      let svg = `<line x1="0" x2="${KI_W}" y1="${base - peak * step}" y2="${base - peak * step}" stroke="rgba(255,214,92,.45)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`;
      days.forEach((d, i) => {
        const x = i * col + 1, l = Number(d.level) || 0, top = base - Math.max(10, l * step);
        svg += l === 0
          ? `<rect x="${x}" y="${base - 10}" width="${bw}" height="10" rx="2" fill="#5ab8ff"/>`
          : `<rect x="${x}" y="${base - l * step}" width="${bw}" height="${l * step}" rx="2" fill="${l >= peak ? '#fff3a1' : 'url(#kiGold)'}"${l >= peak ? ' filter="url(#kiGlow)"' : ''}/>`;
        for (let k = 0; k < (Number(d.faps) || 0); k++) svg += `<circle cx="${x + bw / 2}" cy="${top - 5 - k * 7}" r="2.8" fill="#5ab8ff"/>`;
      });
      const labels = days.map((d, i) => { const t = dayOf(d.day); return `<span>${(n - 1 - i) % 7 === 0 ? t.getUTCDate() + ' ' + MONTHS[t.getUTCMonth()] : ''}</span>`; }).join('');
      box.innerHTML =
        `<div class="ki-top" data-info="ki"><div><span class="label">🔥 Ki charge</span><div class="ki-big">${now >= peak ? 'Full power' : now ? 'Charging' : 'Empty'}</div>` +
        `<div class="ki-sub">${now >= peak ? 'At peak' : now ? `${now} of ${peak}` : 'Builds again from tomorrow'}</div></div>` +
        `<div class="ki-stat"><div class="n">${esc(fmtNum(ki.peaks || 0))}</div><span class="label">Peaks · 28 days</span></div></div>` +
        `<div class="ki-sec"><span class="label">Charge now · healing cap ${esc(fmtNum(ki.heal_cap))} HP</span>` +
        `<div class="ki-pips${now === 0 ? ' empty' : ''}">${Array.from({ length: peak }, (_, k) => `<div class="ki-pip${k < now ? (now >= peak ? ' on peak' : ' on') : ''}"></div>`).join('')}</div></div>` +
        `<div class="ki-sec"><span class="label">Last 28 days</span><div class="ki-wrap">` +
        `<svg class="ki-chart" viewBox="0 0 ${KI_W} ${KI_H}" preserveAspectRatio="none" aria-label="Ki charge, last 28 days"><defs>` +
        `<linearGradient id="kiGold" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c99318"/><stop offset="1" stop-color="#ffd65c"/></linearGradient>` +
        `<filter id="kiGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${svg}</svg>` +
        `<div class="ld-tip" hidden></div><div class="ki-x">${labels}</div></div>` +
        `<div class="ki-legend"><span><i style="background:#ffd65c"></i>Charge</span><span><i style="background:#fff3a1;box-shadow:0 0 6px #ffd65c"></i>Peak</span><span><i style="background:#5ab8ff"></i>Empty</span><span><i class="ball" style="background:#5ab8ff"></i>Fap</span></div></div>`;
      box.hidden = false;
      const wrap = box.querySelector('.ki-wrap'), tip = wrap.querySelector('.ld-tip');
      const at = ev => { const r = wrap.getBoundingClientRect(); return Math.max(0, Math.min(n - 1, Math.floor(((ev.clientX - r.left) / r.width) * n))); };
      const show = i => {
        const d = days[i], t = dayOf(d.day), f = Number(d.faps) || 0, l = Number(d.level) || 0;
        tip.innerHTML = `${WEEKDAYS[t.getUTCDay()]} ${t.getUTCDate()} ${MONTHS[t.getUTCMonth()]}${i === n - 1 ? ' · today' : ''}<br>` +
          (f ? `${f} Fap tap${f > 1 ? 's' : ''}<br>` : '') + `<span class="g">${l >= peak ? 'Peak' : l ? 'Charge ' + l + ' of ' + peak : 'Empty'}</span>`;
        tip.hidden = false;
        const w = wrap.clientWidth, left = ((i + 0.5) / n) * w;
        tip.style.left = Math.max(0, Math.min(w - tip.offsetWidth, left + (left > w / 2 ? -tip.offsetWidth - 8 : 8))) + 'px';
      };
      const hide = () => { tip.hidden = true; };
      wrap.addEventListener('pointerdown', ev => { ev.stopPropagation(); show(at(ev)); });
      wrap.addEventListener('pointermove', ev => show(at(ev)));
      wrap.addEventListener('pointerleave', hide);
      wrap.addEventListener('pointercancel', hide);
      wrap.addEventListener('click', ev => ev.stopPropagation());
    }

    // Moves tab: only the moves already unlocked. Moves still to come are a
    // complete surprise: no tile, name or mark (Roy, 2 Oct 2026).
    function renderMoves() {
      const el = document.getElementById('moves');
      if (!power) { el.innerHTML = '<div class="empty">No power reading yet.</div>'; powerKey = ''; return; }
      const moves = Array.isArray(power.moves) ? power.moves : [];
      const key = JSON.stringify(moves);
      if (key === powerKey) return; // keeps a playing move clip running
      powerKey = key;
      const tiles = moves.filter(m => m.state !== 'locked').map(m => {
        const making = !m.image_url && !m.video_url;
        const pic = m.video_url ? clipStill(m.video_url) : m.image_url ? smallImage(m.image_url) : '';
        const bg = pic ? ` style="background-image:url('${esc(pic)}')"` : '';
        const badge = making ? '<span class="move-badge making">Being drawn</span>' : MOVE_BADGE[m.state] ? `<span class="move-badge ${esc(m.state)}">${MOVE_BADGE[m.state]}</span>` : '';
        return `<div class="move ${esc(m.state)}" data-key="${esc(m.key)}" role="button" tabindex="0" aria-label="${esc(m.name)}"${bg}>${badge}<div class="move-cap"><div class="move-name">${esc(m.name)}</div><div class="move-meta">${esc(fmtNum(m.power))} · ×${esc(m.mult)} on a workout</div></div></div>`;
      }).join('');
      const waiting = moves.some(m => m.state === 'locked');
      el.innerHTML = (tiles ? `<div class="moves">${tiles}</div>` : '<div class="empty">No signature move yet. Train, and one will come.</div>') +
        (waiting ? '<div class="power-note">More moves are waiting. Keep training.</div>' : '') +
        `<div class="power-note">The strongest awake move charges every Monday and fires by itself on your next Strava workout. If your power drops below a move's mark it sleeps until you train back up. Tap an awake move to play it; a dormant one stays still.</div>`;
    }

    function toggleMoveClip(tile) {
      const m = (power && Array.isArray(power.moves) ? power.moves : []).find(x => x.key === tile.dataset.key);
      const playing = tile.querySelector('video');
      document.querySelectorAll('.move video').forEach(v => v.remove());
      // A dormant move stays a still, greyed-out picture (Roy, 3 Oct 2026).
      if (playing || !m || !m.video_url || m.state === 'dormant') return;
      const video = document.createElement('video');
      Object.assign(video, { src: smallClip(m.video_url), muted: true, loop: true, playsInline: true, autoplay: true });
      video.setAttribute('playsinline', '');
      video.addEventListener('playing', () => video.classList.add('ready'), { once: true });
      tile.insertBefore(video, tile.firstChild);
      video.play().catch(() => {});
    }

    function selectTab(id) {
      document.querySelectorAll('.tab').forEach(tab => {
        const on = tab.id === id;
        tab.setAttribute('aria-selected', String(on));
        document.getElementById(tab.getAttribute('aria-controls')).hidden = !on;
      });
      if (id !== 'tabForms') closeForm();
      if (id === 'tabMoves') renderMoves();
      else document.querySelectorAll('.move video').forEach(v => v.remove());
    }

    function setFlipped(flipped) {
      const flipMs = reduceMotion ? 0 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--flip-ms')) || 1100;
      flipperEl.classList.toggle('is-flipped', flipped);
      progressHudEl.setAttribute('aria-hidden', String(flipped));
      backEl.setAttribute('aria-hidden', String(!flipped));
      clearTimeout(flipTimer);
      flipTimer = setTimeout(() => flipperEl.classList.toggle('show-back', flipped), flipMs / 2);
      if (flipped) {
        renderBack();
        showReading();
        loadHero();
        document.querySelectorAll('.panel').forEach(p => { p.scrollTop = 0; });
        setTimeout(() => videos.forEach(v => v.pause()), flipMs);
      } else {
        closeForm();
        videos[activeVideoIndex].play().catch(() => {});
      }
    }

    // ---- Tap a metric for what it means (Roy, 3 Oct 2026) ----
    // Rules from quest-engine (src/power.js, src/rules/mainquest.js, hero-card.js).
    // Never name a form, level, move or mark still to come here.
    const INFO = {
      level: { title: 'Level', text: 'Goku\'s level. Each level has 4 stages, the notches on the XP bar. When the XP bar is full, Goku goes up a level.' },
      hp: { title: 'HP · Goku\'s health', text: 'Bad habits and the boss\'s strikes take HP away. Healing habits and the nightly recovery at 04:00 give it back. At 0 HP Goku can\'t attack until he is healed.\nA blue +number after the HP is today\'s ki shield, from last night\'s sleep recovery: bad habits\' hits take the shield first, and it is gone at 04:00.' },
      xp: { title: 'XP · progress through this level', text: 'XP grows every night at 04:00. The three dots are your Success days among the last 3 journal days (the Success box in your journal): the more dots, the faster XP grows and the brighter the bar. Gravity adds a bonus on top. The notches are the stages of this level.' },
      power: { title: 'Power level', text: 'Your long-term fitness from your Strava workouts, × 100. It builds over about 6 weeks of training and fades slowly when you rest. The ▲/▼ is the change over the last 12 weeks. Reaching certain power levels unlocks signature moves.' },
      long: { title: 'Long-term load (green line)', text: 'Your fitness: the training of roughly the last 6 weeks. It is the same number as your power level. It rises slowly and falls slowly.' },
      short: { title: 'Short-term load (pink line)', text: 'Your fatigue: the training of roughly the last week. It jumps after a hard workout and drops within days when you rest.' },
      ratio: { title: 'Load ratio (blue line)', text: 'Short-term load divided by long-term load: how hard this week was compared with what you are used to.\nOptimal (green band, 0.8 to 1.3): building without overdoing it.\nHigh (1.3 to 1.5): ramping up quickly.\nRisk (above 1.5, red band): much more than your body is used to, so injuries and illness get more likely.\nLow (under 0.8): easing off.' },
      recovery: { title: 'Recovery', text: 'Each morning\'s verdict, the same as the dashboard\'s Recovery today: last night\'s HRV, resting heart rate and sleep against your last 30 nights.\nGreen: Good to go. Yellow: Go steady. Red: Take it easy. Grey: no night measured.' },
      form: { title: 'Form', text: 'Short-term load compared with long-term load.\nRusty: training less than your fitness can take, or hardly any fitness yet.\nSteady: keeping your fitness where it is.\nBuilding: training more than usual, so your fitness grows.\nOverreaching: a lot more than usual. Watch for too much fatigue.\nThe colour strip under the chart shows your form on each day.' },
      gravity: { title: '🪨 Gravity', text: 'Each day you trained in the last 28 days adds 10× (max 280×). Walks and hikes don\'t count, e-bike commutes do, and two workouts on one day count once. Each training day adds 1.5% to the XP Goku gains at 04:00. A day drops out again after 4 weeks, so there is no streak to lose. Each square is a day, today outlined.' },
      ki: { title: '🔥 Ki charge', text: 'Every day without a Fap tap charges Goku\'s ki one step, up to peak at 5. A day counts from the morning (04:00); a Fap tap that day takes it back.\nOne Fap tap takes 2 steps off. Two in one day, or a tap on two days in a row, empties it.\nThe charge heals: today\'s healing cap is 50 HP + 10 HP per step (100 at peak), and the 04:00 recovery heals 10% more per step (+50% at peak).\nEach blue ball in the graph is a Fap tap; a blue bar is an empty charge.' },
      week: { title: '🫘 This week', text: 'Your training time this week, Monday to Sunday. The first time it passes 6 hours you get a Senzu bean: Goku\'s HP is fully healed, once a week, and the card glows green until Sunday night.' },
      run: { title: 'Success days in a row', text: 'Journal days in a row with Success ticked, up to today. Today doesn\'t break the run while it isn\'t ticked yet.' },
      best: { title: 'Best day', text: 'The most XP Goku gained in one night, and the day it was for.' },
      successDays: { title: 'Success days', text: 'How many of your journal days had Success ticked (over the last 100 days).' },
      longest: { title: 'Longest run', text: 'The most Success days in a row so far (over the last 100 days).' }
    };
    const infoEl = document.getElementById('info');

    function infoNow(key) {
      const p = power || {};
      if (key === 'gravity' && p.gravity) return `${fmtNum(p.gravity.days || 0)} training days → ${fmtNum(p.gravity.gravity || 0)}×, +${Math.round((Number(p.gravity.xp_bonus) || 0) * 1000) / 10}% XP`;
      if (key === 'week' && p.week) { const m = Number(p.week.minutes) || 0; return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} this week · ${p.week.senzu ? 'Senzu earned' : 'Senzu at 6 h'}`; }
      if (key === 'form' && p.form_state) return 'Now: ' + p.form_state;
      if (key === 'ratio' && p.load_ratio && p.load_ratio.value !== null && p.load_ratio.value !== undefined) return `Now: ${Number(p.load_ratio.value).toFixed(2)} · ${p.load_ratio.zone}`;
      if (key === 'recovery' && p.load && Array.isArray(p.load.recovery)) { const r = p.load.recovery[p.load.recovery.length - 1]; return r ? 'Today: ' + (REC_TEXT[r] || r) : 'No night measured yet today'; }
      if (key === 'ki' && p.ki) return `Charge ${p.ki.level} of ${p.ki.peak} · healing cap ${p.ki.heal_cap} HP · overnight +${Math.round((Number(p.ki.recovery_bonus) || 0) * 100)}%`;
      return '';
    }

    function showInfo(key) {
      const info = INFO[key];
      if (!info) return false;
      document.getElementById('infoTitle').textContent = info.title;
      const now = infoNow(key), nowEl = document.getElementById('infoNow');
      nowEl.textContent = now;
      nowEl.hidden = !now;
      document.getElementById('infoText').textContent = info.text;
      infoEl.hidden = false;
      return true;
    }

    infoEl.addEventListener('click', event => { event.stopPropagation(); infoEl.hidden = true; });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && !infoEl.hidden) { event.stopPropagation(); infoEl.hidden = true; } }, true);
    const infoTarget = event => { const t = event.target.closest('[data-info]'); return !!t && showInfo(t.dataset.info); };

    progressHudEl.addEventListener('click', event => { if (!infoTarget(event)) setFlipped(true); });
    progressHudEl.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); setFlipped(true); }
    });
    backEl.addEventListener('click', event => {
      if (infoTarget(event)) return;
      const tab = event.target.closest('.tab');
      if (tab) { selectTab(tab.id); return; }
      if (event.target.closest('#formBack')) { closeForm(); return; }
      const move = event.target.closest('.move[data-key]');
      if (move) { toggleMoveClip(move); return; }
      const tile = event.target.closest('.form');
      if (tile) { if (tile.classList.contains('form-big')) toggleFormClip(tile); else openForm(tile.dataset.level); return; }
      const day = event.target.closest('.day[data-date]');
      if (day) { toggleDay(day); return; }
      if (event.target.closest('#reading, #scouterLabel')) { rescan(); return; }
      if (event.target.closest('#hbHead, #hbHint')) setFlipped(false);
    });
    backEl.addEventListener('keydown', event => {
      const move = event.target.closest('.move[data-key]');
      if (move && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); toggleMoveClip(move); return; }
      const tile = event.target.closest('.form');
      if (tile && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); if (tile.classList.contains('form-big')) toggleFormClip(tile); else openForm(tile.dataset.level); }
      const day = event.target.closest('.day[data-date]');
      if (day && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); toggleDay(day); return; }
      if (event.key === 'Escape') setFlipped(false);
    });
    // Browsers pause muted video in a hidden tab; pick the front back up.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !flipperEl.classList.contains('is-flipped')) videos[activeVideoIndex].play().catch(() => {});
    });

    monitorVideoLoop();
    loadHero();
    refreshDashboard();
    setInterval(refreshDashboard, REFRESH_MS);
  </script>
</body>
</html>
