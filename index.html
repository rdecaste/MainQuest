<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <title>Main Quest</title>
  <style>
    :root {
      --glass: rgba(7, 10, 16, 0.32);
      --line: rgba(255,255,255,0.09);
      --text: #fff;
      --muted: rgba(255,255,255,0.58);
      --accent1: #ff9f1c;
      --accent2: #ffd54a;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #05070b;
    }

    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
    }

    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.00) 0%,
        rgba(0,0,0,0.00) 58%,
        rgba(0,0,0,0.18) 76%,
        rgba(0,0,0,0.56) 100%
      );
      pointer-events: none;
    }

    .metrics {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(16px + var(--safe-bottom));
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    .metric {
      min-height: 82px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .label {
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .value {
      font-size: clamp(31px, 10vw, 42px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .progress {
      padding: 12px 14px 14px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
    }

    .progress-percent {
      font-size: 12px;
      font-weight: 800;
      color: rgba(255,255,255,0.72);
    }

    .bar {
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      box-shadow: 0 0 16px rgba(255,196,54,0.30);
    }
  </style>
</head>
<body>
  <main class="screen">
    <img
      class="hero"
      src="https://res.cloudinary.com/a3xk0plk/image/upload/v1788696083/8177ba3e-8184-4b5f-ac9c-e0ebbc0b2d2b.png"
      alt="Goku"
    />

    <div class="shade"></div>

    <section class="metrics">
      <div class="row">
        <article class="card metric">
          <div class="label">Level</div>
          <div class="value">1</div>
        </article>

        <article class="card metric">
          <div class="label">XP</div>
          <div class="value">12</div>
        </article>
      </div>

      <article class="card progress" aria-label="Progress 10 percent">
        <div class="progress-head">
          <div class="label">Progress</div>
          <div class="progress-percent">10%</div>
        </div>
        <div class="bar">
          <div class="fill"></div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
