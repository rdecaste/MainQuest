<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Main Quest</title>
  <style>
    :root {
      --text: #fff;
      --muted: rgba(255,255,255,0.72);
      --accent1: #ff9f1c;
      --accent2: #ffd54a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Galaxy S20 portrait kiosk target: 1440x3200 = 9:20.
       100dvh tracks the actually visible Android viewport in kiosk/full-screen mode. */
    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      overflow: hidden;
      background: #05070b;
    }

    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: 50% 50%;
      background: #05070b;
    }

    /* Small, transparent HUD tuned for the ~360x800 CSS viewport of an S20. */
    .metrics {
      position: absolute;
      left: calc(10px + var(--safe-left));
      bottom: calc(16px + var(--safe-bottom));
      width: clamp(150px, 47vw, 178px);
      display: grid;
      gap: 4px;
      z-index: 2;
      pointer-events: none;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .card {
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .metric {
      min-height: 43px;
      padding: 3px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .label {
      font-size: 7px;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
    }

    .value {
      font-size: clamp(20px, 6vw, 24px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.035em;
      text-shadow: 0 1px 5px rgba(0,0,0,0.9);
    }

    .progress {
      padding: 3px 4px 4px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .progress-percent {
      font-size: 8px;
      font-weight: 750;
      color: rgba(255,255,255,0.8);
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
    }

    .bar {
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.18);
      box-shadow: 0 1px 4px rgba(0,0,0,0.42);
    }

    .fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      box-shadow: 0 0 8px rgba(255,196,54,0.28);
      transition: width 350ms ease;
    }

    /* Keep the kiosk portrait-first if Android briefly reports a wider viewport. */
    @media (orientation: landscape) {
      .metrics {
        width: min(178px, 34vw);
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <video
      id="heroVideo"
      class="hero"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      poster="https://res.cloudinary.com/a3xk0plk/image/upload/v1788696083/8177ba3e-8184-4b5f-ac9c-e0ebbc0b2d2b.png"
    >
      <source id="heroSource" src="https://res.cloudinary.com/a3xk0plk/video/upload/v1788698711/Quest-Progress/3d124147-f877-81d1-a87b-fe82ea613420.mp4" type="video/mp4" />
    </video>

    <section class="metrics">
      <div class="row">
        <article class="card metric">
          <div class="label">Level</div>
          <div class="value" id="level">1</div>
        </article>

        <article class="card metric">
          <div class="label">XP</div>
          <div class="value" id="xp">12</div>
        </article>
      </div>

      <article class="card progress" id="progressCard" aria-label="Progress 10 percent">
        <div class="progress-head">
          <div class="label">Progress</div>
          <div class="progress-percent" id="progressPercent">10%</div>
        </div>
        <div class="bar">
          <div class="fill" id="progressFill"></div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const STATE_URL = "https://res.cloudinary.com/a3xk0plk/raw/upload/MainQuest/data.json";

    async function loadState() {
      try {
        const response = await fetch(`${STATE_URL}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`State request failed: ${response.status}`);
        const data = await response.json();

        document.getElementById("level").textContent = data.level ?? "-";
        document.getElementById("xp").textContent = data.xp ?? "-";

        const progress = Number(data.progress ?? 0);
        const safeProgress = Math.max(0, Math.min(100, progress));
        document.getElementById("progressPercent").textContent = `${progress}%`;
        document.getElementById("progressFill").style.width = `${safeProgress}%`;
        document.getElementById("progressCard").setAttribute("aria-label", `Progress ${progress} percent`);

        const video = document.getElementById("heroVideo");
        const source = document.getElementById("heroSource");

        if (data.image_url && video.poster !== data.image_url) {
          video.poster = data.image_url;
        }

        if (data.video_url && source.getAttribute("src") !== data.video_url) {
          source.setAttribute("src", data.video_url);
          video.load();
          video.play().catch(() => {});
        }
      } catch (error) {
        console.error("Could not load Main Quest state", error);
      }
    }

    loadState();
    setInterval(loadState, 60000);
  </script>
</body>
</html>
