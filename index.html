<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Main Quest</title>
  <style>
    :root {
      --bg:#05070b;
      --text:#fff;
      --muted:rgba(255,255,255,.72);
      --accent-a:#ff9f1c;
      --accent-b:#ffd54a;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body{width:100vw;height:100vh;height:100dvh}
    .app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
    #heroVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:var(--bg);display:block;transform:scale(var(--video-scale,1));transform-origin:center}
    .hud-top{position:absolute;top:calc(12px + var(--safe-top));left:calc(12px + var(--safe-left));right:calc(12px + var(--safe-right));display:flex;justify-content:space-between;z-index:2;pointer-events:none}
    .metric.right{text-align:right}
    .label{font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 4px rgba(0,0,0,.85)}
    .value{margin-top:3px;font-size:clamp(23px,6.5vw,31px);line-height:1;font-weight:850;letter-spacing:-.04em;text-shadow:0 1px 6px rgba(0,0,0,.9)}
    .hud-bottom{position:absolute;left:calc(12px + var(--safe-left));right:calc(12px + var(--safe-right));bottom:calc(14px + var(--safe-bottom));z-index:2;pointer-events:none}
    .progress-head{display:flex;justify-content:space-between;margin-bottom:6px}
    .progress-value{font-size:10px;font-weight:800;color:rgba(255,255,255,.82);text-shadow:0 1px 4px rgba(0,0,0,.85)}
    .progress-track{width:100%;height:7px;overflow:visible;border-radius:999px;background:rgba(255,255,255,.18);--flow-duration:8s;--flow-opacity:.16;--bar-glow:0 0 4px rgba(255,213,74,.18);--pulse-duration:8s}
    .progress-track[data-tier="2"]{--flow-duration:5.5s;--flow-opacity:.25;--bar-glow:0 0 6px rgba(255,213,74,.28);--pulse-duration:6s}
    .progress-track[data-tier="3"]{--flow-duration:3.2s;--flow-opacity:.38;--bar-glow:0 0 9px rgba(255,213,74,.42);--pulse-duration:4.2s}
    .progress-track[data-tier="4"]{--flow-duration:1.9s;--flow-opacity:.55;--bar-glow:0 0 13px rgba(255,213,74,.58);--pulse-duration:2.8s}
    .progress-fill{position:relative;width:0%;height:100%;overflow:hidden;border-radius:inherit;background:linear-gradient(90deg,var(--accent-a),var(--accent-b));box-shadow:var(--bar-glow);transition:width 300ms ease;animation:bar-pulse var(--pulse-duration) ease-in-out infinite}
    .progress-fill::after{content:"";position:absolute;top:0;bottom:0;left:-45%;width:42%;background:linear-gradient(90deg,transparent,rgba(255,255,255,var(--flow-opacity)),transparent);transform:skewX(-18deg);animation:bar-flow var(--flow-duration) linear infinite}
    @keyframes bar-flow{from{left:-45%}to{left:110%}}
    @keyframes bar-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.08)}}
    .stage-orbs{display:flex;justify-content:center;gap:12px;margin-bottom:12px;min-height:14px}
    .stage-orb{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3bd 0%,#ffd54a 35%,#ee8a19 80%);box-shadow:0 0 5px #fff1aa66,0 0 14px #ffc43c77}
    .stage-orb[hidden]{display:none}
    .xp-gain{position:absolute;top:100%;margin-top:9px;padding:5px 8px;border-radius:8px;background:rgba(5,7,11,.7);color:var(--accent-b);font-size:13px;font-weight:800}
    .xp-gain:not([hidden]){animation:xp-arrive 450ms ease-out}
    @keyframes xp-arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.xp-gain:not([hidden]){animation:none}.progress-fill{transition:none;animation:none}.progress-fill::after{animation:none;display:none}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <video id="heroVideo" autoplay muted loop playsinline preload="auto"></video>

    <div class="hud-top">
      <div class="metric"><div class="label">XP</div><div class="value" id="xp">—</div><div class="xp-gain" id="xpGain" role="status" aria-live="polite" hidden></div></div>
      <div class="metric right"><div class="label">Level</div><div class="value" id="level">—</div></div>
    </div>

    <div class="hud-bottom">
      <div class="progress-head"><div class="label">Level Progress</div><div class="progress-value" id="progressText">0%</div></div>
      <div class="stage-orbs" id="stageOrbs" role="img" aria-label="Sublevel 1 of 3"><span class="stage-orb" id="orb1" aria-hidden="true"></span><span class="stage-orb" id="orb2" aria-hidden="true" hidden></span><span class="stage-orb" id="orb3" aria-hidden="true" hidden></span></div>
      <div class="progress-track" id="levelProgress" data-tier="1" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </main>

  <script>
    const STATE_URL = 'https://raw.githubusercontent.com/rdecaste/MainQuest/main/data.json';
    const REFRESH_MS = 15000;

    const video = document.getElementById('heroVideo');
    const xpEl = document.getElementById('xp');
    const levelEl = document.getElementById('level');
    const progressTextEl = document.getElementById('progressText');
    const progressFillEl = document.getElementById('progressFill');
    const progressTrackEl = document.getElementById('levelProgress');

    function performanceTier(state) {
      const tier = Number(state.performance_tier);
      if (Number.isInteger(tier) && tier >= 1 && tier <= 4) return tier;
      const rate = Number(state.performance_rate);
      if (!Number.isFinite(rate)) return 1;
      return rate >= 99.5 ? 4 : rate >= 66 ? 3 : rate >= 33 ? 2 : 1;
    }

    // This existing asset has baked-in top/bottom letterboxing (~8% each).
    // Crop only this asset; future edge-to-edge videos keep their normal cover fit.
    const VIDEO_FRAMING = {
      'Quest-Progress/main-quest-20260917-073323': 1.20
    };
    let loadedVideoKey = '';
    const XP_STORAGE_KEY = 'mainQuest.lastSeenXp.v1';
    let lastSeenXp = null;
    let gainTimer;
    try {
      const saved = localStorage.getItem(XP_STORAGE_KEY);
      if (saved !== null && Number.isFinite(Number(saved))) lastSeenXp = Number(saved);
    } catch (_) {}

    function renderState(state) {
      xpEl.textContent = state.xp ?? '—';
      const wholeLevel = Math.trunc(Number(state.level ?? state.display_level));
      levelEl.textContent = Number.isFinite(wholeLevel) && wholeLevel > 0 ? wholeLevel : '—';

      const currentXp = state.xp == null ? NaN : Number(state.xp);
      if (Number.isFinite(currentXp)) {
        const gain = lastSeenXp === null ? 0 : currentXp - lastSeenXp;
        if (gain > 0) {
          const toast = document.getElementById('xpGain');
          toast.textContent = '+' + gain.toLocaleString() + ' XP';
          toast.hidden = false;
          clearTimeout(gainTimer);
          gainTimer = setTimeout(() => { toast.hidden = true; }, 4000);
        }
        lastSeenXp = currentXp;
        try { localStorage.setItem(XP_STORAGE_KEY, String(currentXp)); } catch (_) {}
      }

      const rawProgress = Number(state.level_progress ?? state.progress ?? 0);
      const progress = Number.isFinite(rawProgress) ? Math.max(0, Math.min(100, rawProgress)) : 0;
      progressTextEl.textContent = progress + '%';
      progressFillEl.style.width = progress + '%';
      progressTrackEl.setAttribute('aria-valuenow', String(progress));

      const derivedSublevel = progress >= (200 / 3) ? 3 : progress >= (100 / 3) ? 2 : 1;
      const stateSublevel = Math.trunc(Number(state.sublevel));
      const sublevel = Number.isFinite(stateSublevel) && stateSublevel >= 1 && stateSublevel <= 3 ? stateSublevel : derivedSublevel;
      for (let i = 1; i <= 3; i++) document.getElementById('orb' + i).hidden = i > sublevel;
      document.getElementById('stageOrbs').setAttribute('aria-label', 'Sublevel ' + sublevel + ' of 3');

      const tier = performanceTier(state);
      progressTrackEl.dataset.tier = String(tier);
    }

    async function refreshDashboard() {
      try {
        const response = await fetch(`${STATE_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) return;

        const state = await response.json();
        renderState(state);

        const videoUrl = state.video_url || '';
        const videoKey = String(state.video_public_id || state.video_version || videoUrl);
        const framingId = state.video_public_id || videoUrl.split('/').slice(-2).join('/').replace(/\.mp4(?:\?.*)?$/, '');
        video.style.setProperty('--video-scale', String(VIDEO_FRAMING[framingId] || 1));

        if (videoUrl && videoKey !== loadedVideoKey) {
          loadedVideoKey = videoKey;
          video.pause();
          video.removeAttribute('src');
          video.load();
          video.src = videoUrl;
          video.load();
          video.play().catch(() => {});
        }
      } catch (error) {
        console.error('Dashboard refresh failed', error);
      }
    }

    refreshDashboard();
    setInterval(refreshDashboard, REFRESH_MS);
  </script>
</body>
</html>
