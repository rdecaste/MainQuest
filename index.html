<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <title>Main Quest</title>
  <style>
    :root {
      --text: #fff;
      --muted: rgba(255,255,255,0.72);
      --accent1: #ff9f1c;
      --accent2: #ffd54a;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #05070b;
    }

    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
    }

    .metrics {
      position: absolute;
      left: 8px;
      bottom: calc(8px + var(--safe-bottom));
      width: min(185px, 58vw);
      display: grid;
      gap: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .card {
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .metric {
      min-height: 42px;
      padding: 4px 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .label {
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-shadow: 0 1px 4px rgba(0,0,0,0.75);
    }

    .value {
      font-size: clamp(18px, 5.5vw, 24px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.035em;
      text-shadow: 0 1px 5px rgba(0,0,0,0.82);
    }

    .progress {
      padding: 4px 5px 5px;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .progress-percent {
      font-size: 8px;
      font-weight: 750;
      color: rgba(255,255,255,0.78);
      text-shadow: 0 1px 4px rgba(0,0,0,0.75);
    }

    .bar {
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.18);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }

    .fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      box-shadow: 0 0 8px rgba(255,196,54,0.24);
    }
  </style>
</head>
<body>
  <main class="screen">
    <img
      class="hero"
      src="https://res.cloudinary.com/a3xk0plk/image/upload/v1788696083/8177ba3e-8184-4b5f-ac9c-e0ebbc0b2d2b.png"
      alt="Goku"
    />

    <section class="metrics">
      <div class="row">
        <article class="card metric">
          <div class="label">Level</div>
          <div class="value">1</div>
        </article>

        <article class="card metric">
          <div class="label">XP</div>
          <div class="value">12</div>
        </article>
      </div>

      <article class="card progress" aria-label="Progress 10 percent">
        <div class="progress-head">
          <div class="label">Progress</div>
          <div class="progress-percent">10%</div>
        </div>
        <div class="bar">
          <div class="fill"></div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
