<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Main Quest</title>
  <style>
    :root {
      --bg:#05070b;
      --text:#fff;
      --muted:rgba(255,255,255,.72);
      --accent-a:#ff9f1c;
      --accent-b:#ffd54a;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body{width:100vw;height:100vh;height:100dvh}
    .app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
    #heroVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:var(--bg);display:block}
    .hud-top{position:absolute;top:calc(12px + var(--safe-top));left:calc(12px + var(--safe-left));right:calc(12px + var(--safe-right));display:flex;justify-content:space-between;z-index:2;pointer-events:none}
    .metric.right{text-align:right}
    .label{font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 4px rgba(0,0,0,.85)}
    .value{margin-top:3px;font-size:clamp(23px,6.5vw,31px);line-height:1;font-weight:850;letter-spacing:-.04em;text-shadow:0 1px 6px rgba(0,0,0,.9)}
    .hud-bottom{position:absolute;left:calc(12px + var(--safe-left));right:calc(12px + var(--safe-right));bottom:calc(14px + var(--safe-bottom));z-index:2;pointer-events:none}
    .progress-head{display:flex;justify-content:space-between;margin-bottom:6px}
    .progress-value{font-size:10px;font-weight:800;color:rgba(255,255,255,.82);text-shadow:0 1px 4px rgba(0,0,0,.85)}
    .progress-track{width:100%;height:7px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.18)}
    .progress-fill{width:0%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent-a),var(--accent-b));transition:width 300ms ease}
    .stage-markers{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px}
    .stage-marker{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:rgba(255,255,255,.5);text-shadow:0 1px 4px #000}
    .stage-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}
    .stage-marker.reached{color:var(--accent-b)}
    .stage-marker.reached .stage-dot{background:var(--accent-a)}
    .stage-marker.current .stage-dot{background:var(--accent-b);box-shadow:0 0 0 3px rgba(255,213,74,.18)}
    .xp-gain{position:absolute;top:100%;margin-top:9px;padding:5px 8px;border-radius:8px;background:rgba(5,7,11,.7);color:var(--accent-b);font-size:13px;font-weight:800}
    .xp-gain:not([hidden]){animation:xp-arrive 450ms ease-out}
    @keyframes xp-arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.xp-gain:not([hidden]){animation:none}.progress-fill{transition:none}}
  </style>
</head>
<body>
  <main class="app">
    <video id="heroVideo" autoplay muted loop playsinline preload="auto"></video>

    <div class="hud-top">
      <div class="metric"><div class="label">XP</div><div class="value" id="xp">—</div><div class="xp-gain" id="xpGain" role="status" aria-live="polite" hidden></div></div>
      <div class="metric right"><div class="label">Level</div><div class="value" id="level">—</div></div>
    </div>

    <div class="hud-bottom">
      <div class="progress-head"><div class="label">Level Progress</div><div class="progress-value" id="progressText">0%</div></div>
      <div class="stage-markers" aria-label="Four sublevels"><div class="stage-marker" id="stage1"><span class="stage-dot" aria-hidden="true"></span><span id="stageLabel1">.1</span></div><div class="stage-marker" id="stage2"><span class="stage-dot" aria-hidden="true"></span><span id="stageLabel2">.2</span></div><div class="stage-marker" id="stage3"><span class="stage-dot" aria-hidden="true"></span><span id="stageLabel3">.3</span></div><div class="stage-marker" id="stage4"><span class="stage-dot" aria-hidden="true"></span><span id="stageLabel4">.4</span></div></div>
      <div class="progress-track" id="levelProgress" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </main>

  <script>
    const STATE_URL = 'https://raw.githubusercontent.com/rdecaste/MainQuest/main/data.json';
    const REFRESH_MS = 15000;

    const video = document.getElementById('heroVideo');
    const xpEl = document.getElementById('xp');
    const levelEl = document.getElementById('level');
    const progressTextEl = document.getElementById('progressText');
    const progressFillEl = document.getElementById('progressFill');

    let loadedVideoKey = '';
    const XP_STORAGE_KEY = 'mainQuest.lastSeenXp.v1';
    let lastSeenXp = null;
    let gainTimer;
    try {
      const saved = localStorage.getItem(XP_STORAGE_KEY);
      if (saved !== null && Number.isFinite(Number(saved))) lastSeenXp = Number(saved);
    } catch (_) {}
    function renderState(state) {
      xpEl.textContent = state.xp ?? '—';
      levelEl.textContent = state.display_level ?? state.level ?? '—';
      const currentXp = state.xp == null ? NaN : Number(state.xp);
      if (Number.isFinite(currentXp)) {
        const gain = lastSeenXp === null ? 0 : currentXp - lastSeenXp;
        if (gain > 0) {
          const toast = document.getElementById('xpGain');
          toast.textContent = '+' + gain.toLocaleString() + ' XP';
          toast.hidden = false;
          clearTimeout(gainTimer);
          gainTimer = setTimeout(() => { toast.hidden = true; }, 4000);
        }
        lastSeenXp = currentXp;
        try { localStorage.setItem(XP_STORAGE_KEY, String(currentXp)); } catch (_) {}
      }
      const rawProgress = Number(state.level_progress ?? state.progress ?? 0);
      const progress = Number.isFinite(rawProgress) ? Math.max(0, Math.min(100, rawProgress)) : 0;
      progressTextEl.textContent = progress + '%';
      progressFillEl.style.width = progress + '%';
      document.getElementById('levelProgress').setAttribute('aria-valuenow', String(progress));
      const sublevel = Math.max(1, Math.min(4, Math.trunc(Number(state.sublevel) || 1)));
      for (let i = 1; i <= 4; i++) {
        const marker = document.getElementById('stage' + i);
        marker.classList.toggle('reached', i <= sublevel);
        marker.classList.toggle('current', i === sublevel);
        marker.setAttribute('aria-label', 'Sublevel ' + i + (i < sublevel ? ', completed' : i === sublevel ? ', current' : ', upcoming'));
        document.getElementById('stageLabel' + i).textContent = (state.level ?? '—') + '.' + i;
      }
    }

    async function refreshDashboard() {
      try {
        const response = await fetch(`${STATE_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) return;

        const state = await response.json();

        renderState(state);

        const videoUrl = state.video_url || '';
        const videoKey = String(state.video_public_id || state.video_version || videoUrl);

        if (videoUrl && videoKey !== loadedVideoKey) {
          loadedVideoKey = videoKey;
          video.pause();
          video.removeAttribute('src');
          video.load();
          video.src = videoUrl;
          video.load();
          video.play().catch(() => {});
        }
      } catch (error) {
        console.error('Dashboard refresh failed', error);
      }
    }

    refreshDashboard();
    setInterval(refreshDashboard, REFRESH_MS);
  </script>
</body>
</html>
